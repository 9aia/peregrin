[profile.default]
# terminate-after counts `period`s (4 × 30s = 120s); it must be an
# integer — a duration string fails config parsing.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "final"
# A serialized spawned-binaries suite costs real time — a first
# failure must not cancel the rest and throw away the whole run's
# signal.
fail-fast = false

# Binaries that spawn real peregrin-node/driver processes — under
# `xtask coverage` those children are instrumented (slow to boot)
# and they hold fixed ports, so running too many at once starves them
# into their request timeouts. Cap the group; other tests still run
# full-width.
[[profile.default.overrides]]
filter = 'binary_id(/(::|^)(node|sync_api|transfer)$/)'
# This nextest predates test-groups; threads-required at full width
# serializes the spawned-binaries suites the same way.
threads-required = "num-test-threads"
