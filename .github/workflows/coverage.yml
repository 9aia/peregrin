name: Coverage

on:
  push:
    branches: [v2, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      # peregrin path-deps on a sibling sepia checkout (../sepia).
      - uses: actions/checkout@v4
        with:
          path: peregrin
      # sepia is public.
      - uses: actions/checkout@v4
        with:
          repository: 9aia/sepia
          path: sepia
      # Activate the sibling path deps — without this, cargo still
      # resolves sepia over ssh:// (unauthenticated on a runner).
      - run: cat .cargo/config.toml.example >> .cargo/config.toml
        working-directory: peregrin
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov, cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
          workspaces: peregrin
      - run: cargo xtask coverage --lcov --output-path lcov.info
        working-directory: peregrin
      - name: Gate — every source line covered
        # DA:<line>,0 = a line executed 0 times. Summary % counts
        # per-instantiation regions and can read <100% spuriously.
        run: |
          if grep -nE 'DA:[0-9]+,0(,|$)' peregrin/lcov.info; then
            echo "::error::uncovered lines remain"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: peregrin/lcov.info
