name: ephemeral-fleet

# Example: N GitHub-hosted runners boot as ephemeral peregrin nodes
# against a hub that lives elsewhere (your machine, a server, another
# runner that stays up).
#
# Topology honesty: GitHub-hosted runners accept NO inbound
# connections, so a hub on the public internet cannot dial them — the
# useful directions from a hosted runner are OUTBOUND:
#   * PEREGRIN_SNAPSHOT_TARGET — live/locked snapshots POST to the hub
#     (or a surviving node) on SIGTERM;
#   * `peregrin` CLI verbs against the hub/node URLs.
# For hub→node op routing you need runners the hub can reach —
# self-hosted runners on a tailnet/LAN. This workflow still boots real
# ephemeral nodes and exercises the full SIGTERM→flush path; point
# `bind-host`/`hub-url` at your setup to make it a live fleet.
#
# Required secrets (repo or org):
#   PEREGRIN_TOKEN          bearer every node accepts AND the token the
#                           hub presents to each node (one shared token
#                           keeps PEREGRIN_NODES config simple).
#   PEREGRIN_SNAPSHOT_TOKEN bearer the snapshot-handoff target expects;
#                           falls back to PEREGRIN_TOKEN node-side.
#   PEREGRIN_HUB_TOKEN      optional — bearer for hub→client verbs
#                           (used by the commented-out smoke curl).
# Optional vars:
#   PEREGRIN_FLEET_HOST     bind address (default 0.0.0.0 — set a
#                           specific iface on self-hosted runners).

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'JSON array of node ids, e.g. ["ci-1","ci-2","ci-3"]'
        required: true
        type: string
        default: '["ci-1","ci-2"]'
      hub-url:
        description: >-
          Hub base URL — snapshot handoff target AND the address `peregrin`
          CLI verbs use (e.g. http://hub.tailnet:13000 or
          http://127.0.0.1:13000 when the hub runs in this workflow later).
        required: true
        type: string
      snapshot-node:
        description: >-
          PEREGRIN_SNAPSHOT_NODE — which node the hub should import
          snapshots onto when the target is a hub. Required for handoff.
        required: false
        type: string
        default: ""
      hold-seconds:
        description: "Keep nodes up this long (lets the hub route ops / you poke them)"
        required: false
        type: string
        default: "60"
      peregrin-ref:
        description: "peregrin git ref to install"
        required: false
        type: string
        default: main

jobs:
  node:
    name: node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.nodes) }}
    steps:
      - name: Install peregrin
        uses: 9aia/peregrin/.github/actions/install-peregrin@main
        with:
          ref: ${{ inputs.peregrin-ref }}

      # Deterministic identity: the hub's PEREGRIN_NODES lists
      # `id=url@token` — seeding node.json makes `id` the matrix value
      # instead of a random `node_<hex>` the hub could never name.
      - name: Seed node identity
        shell: bash
        env:
          NODE_ID: ${{ matrix.node }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/peregrin"
          mkdir -p "$home"
          jq -n --arg id "$NODE_ID" --arg name "gha-$NODE_ID" \
            '{id: $id, name: $name}' > "$home/node.json"
          cat "$home/node.json"

      - name: Boot ephemeral node
        shell: bash
        env:
          PEREGRIN_HOST: ${{ vars.PEREGRIN_FLEET_HOST || '0.0.0.0' }}
          PEREGRIN_PORT: "18787"
          PEREGRIN_TOKEN: ${{ secrets.PEREGRIN_TOKEN }}
          PEREGRIN_EPHEMERAL: "1"
          PEREGRIN_HOME: ${{ runner.temp }}/peregrin
          PEREGRIN_SESSION_PLANE: local
          PEREGRIN_SNAPSHOT_DIR: ${{ runner.temp }}/peregrin-snapshots
          PEREGRIN_SNAPSHOT_TARGET: ${{ inputs.hub-url }}
          PEREGRIN_SNAPSHOT_NODE: ${{ inputs.snapshot-node }}
          PEREGRIN_SNAPSHOT_TOKEN: ${{ secrets.PEREGRIN_SNAPSHOT_TOKEN }}
          HEALTH_TIMEOUT: "60"
          NODE_ID: ${{ matrix.node }}
        run: |
          set -euo pipefail
          [ -n "${PEREGRIN_SNAPSHOT_TOKEN:-}" ] || unset PEREGRIN_SNAPSHOT_TOKEN
          mkdir -p "$PEREGRIN_SNAPSHOT_DIR"
          peregrin serve > "$RUNNER_TEMP/peregrin-serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/peregrin.pid"
          for _ in $(seq 1 "$HEALTH_TIMEOUT"); do
            if curl -sf "http://127.0.0.1:${PEREGRIN_PORT}/api/health" >/dev/null 2>&1; then
              echo "node $NODE_ID healthy"
              exit 0
            fi
            kill -0 "$(cat "$RUNNER_TEMP/peregrin.pid")" 2>/dev/null || {
              echo "::error::peregrin serve exited during boot"
              tail -n 50 "$RUNNER_TEMP/peregrin-serve.log"; exit 1; }
            sleep 1
          done
          echo "::error::/api/health not up after ${HEALTH_TIMEOUT}s"
          tail -n 50 "$RUNNER_TEMP/peregrin-serve.log"; exit 1

      - name: Smoke — identity + entity surface
        shell: bash
        env:
          PEREGRIN_TOKEN: ${{ secrets.PEREGRIN_TOKEN }}
          NODE_ID: ${{ matrix.node }}
        run: |
          set -euo pipefail
          # /api/node is behind auth on this bind; the seeded id should
          # come back verbatim.
          body="$(curl -sf -H "Authorization: Bearer $PEREGRIN_TOKEN" \
            http://127.0.0.1:18787/api/node)"
          echo "$body"
          echo "$body" | grep -q "\"id\":\"$NODE_ID\"" \
            || { echo "::error::node id mismatch"; exit 1; }
          # Substrate surface answers even with zero entities.
          curl -sf -H "Authorization: Bearer $PEREGRIN_TOKEN" \
            "http://127.0.0.1:18787/api/entities" | head -c 400; echo

      - name: Hold (hub can route ops here if reachable)
        shell: bash
        run: sleep "${{ inputs.hold-seconds }}"

      - name: Optional — drive the hub as a client
        shell: bash
        env:
          PEREGRIN_NODE_URL: ${{ inputs.hub-url }}
          PEREGRIN_TOKEN: ${{ secrets.PEREGRIN_TOKEN }}
          HUB_TOKEN: ${{ secrets.PEREGRIN_HUB_TOKEN }}
        run: |
          # Uncomment to exercise hub→entity routing from the runner:
          #   curl -sf -H "Authorization: Bearer $HUB_TOKEN" \
          #     "$PEREGRIN_NODE_URL/api/entities" | head -c 400
          echo "hub client env ready (PEREGRIN_NODE_URL=$PEREGRIN_NODE_URL)"

      # always(): flush snapshots even when a step above failed.
      - name: Stop node (SIGTERM → snapshot flush + handoff)
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/peregrin.pid"
          if [ -f "$pid_file" ]; then
            pid="$(cat "$pid_file")"
            if kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid"
              for _ in $(seq 1 30); do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
              kill -0 "$pid" 2>/dev/null && kill -KILL "$pid" || true
            fi
          fi
          echo "--- serve log (tail) ---"
          tail -n 100 "$RUNNER_TEMP/peregrin-serve.log" 2>/dev/null || true
          echo "--- snapshots ---"
          find "$RUNNER_TEMP/peregrin-snapshots" -type f 2>/dev/null | head -50 || true

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.node }}-${{ github.run_id }}
          path: ${{ runner.temp }}/peregrin-snapshots
          if-no-files-found: ignore
          retention-days: 7
