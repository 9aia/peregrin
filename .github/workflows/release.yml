name: release

# Tag-triggered — builds release binaries for linux x86_64 and macOS
# (aarch64 + x86_64) and attaches them to the GitHub release for the
# pushed tag. Mirrors sepia's release.yml staging; asset names match
# the install-peregrin probe convention:
#   peregrin-x86_64-unknown-linux-gnu.tar.gz
# containing `peregrin`, `peregrin-hub`, `peregrin-mcp`, and
# `tamias-driver-peregrin`.
on:
  push:
    tags:
      - "v*"
      - "peregrin-v*"

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # peregrin's manifest pins sibling crates as
      # `ssh://git@github.com/9aia/*.git` git deps. Runners have no SSH
      # keys; the repos are public, so rewrite ssh→https (same trick as
      # .github/actions/install-peregrin).
      - name: Rewrite ssh git deps to https
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build
        # `dist` profile: fat LTO + single codegen unit for shipped
        # binaries (release itself is thin LTO for fast local installs).
        # CARGO_NET_GIT_FETCH_WITH_CLI makes cargo's libgit2 path honor
        # the insteadOf rewrite above.
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo build --locked --profile dist --target ${{ matrix.target }} \
            --bin peregrin --bin peregrin-hub --bin peregrin-mcp \
            --bin tamias-driver-peregrin
      - name: Stage
        run: |
          mkdir -p "dist/peregrin-${{ matrix.target }}"
          cd "target/${{ matrix.target }}/dist"
          for b in peregrin peregrin-hub peregrin-mcp tamias-driver-peregrin; do
            install -m 755 "$b" "$OLDPWD/dist/peregrin-${{ matrix.target }}/"
          done
          tar -czf "$OLDPWD/peregrin-${{ matrix.target }}.tar.gz" -C "$OLDPWD/dist" "peregrin-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: peregrin-${{ matrix.target }}
          path: peregrin-${{ matrix.target }}.tar.gz

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Release
        run: gh release create "${{ github.ref_name }}" --generate-notes peregrin-*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
