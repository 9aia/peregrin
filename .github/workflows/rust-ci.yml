name: Rust

on:
  push:
    branches: [v2, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `cargo xtask check` = the web markup gate + `cargo fmt --all --check`
  # + `cargo clippy --workspace --all-targets -- -D warnings` — the same
  # gate .hooks/pre-push runs. `clippy --all-targets` already typechecks
  # every target, so a separate `cargo check` pass adds nothing.
  check:
    name: Check (markup + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: peregrin
      # sepia is public. Cargo.toml declares sepia as ssh:// git deps;
      # the committed example config patches them onto this sibling
      # checkout so CI never needs ssh access.
      - uses: actions/checkout@v4
        with:
          repository: 9aia/sepia
          path: sepia
      - run: cat .cargo/config.toml.example >> .cargo/config.toml
        working-directory: peregrin
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
          workspaces: peregrin
      - run: cargo xtask check
        working-directory: peregrin

  # `cargo xtask test` prebuilds the spawned binaries (peregrin-*, plus
  # sepia-* from ../sepia) and then runs `cargo nextest run
  # --workspace` — plain nextest would leave N test processes racing
  # `cargo build` on the package lock.
  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: peregrin
      - uses: actions/checkout@v4
        with:
          repository: 9aia/sepia
          path: sepia
      - run: cat .cargo/config.toml.example >> .cargo/config.toml
        working-directory: peregrin
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
          workspaces: peregrin
      - run: cargo xtask test
        working-directory: peregrin
