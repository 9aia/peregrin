# sepia — the session plane these crates embed. Git deps on `main`
# (the branch carrying the `sepia serve` store-op surface —
# `sessions.export`/`import`/`convert`); sibling-checkout path deps
# ride `[patch]` (see `.cargo/config.toml.example`).
sepia-core = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-proto = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-acp = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-session = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-driver = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-host = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-meta = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-convert = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-testkit = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-driver-devin = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-driver-cline = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-driver-claude = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-driver-cursor = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }
sepia-peregrin = { git = "ssh://git@github.com/9aia/sepia.git", branch = "main", version = "0.1.0" }

# hypha — the extracted substrate (PL-005): leaf crates landed in P4a
# (secrets, telemetry, service/systemd, dotenv); the entity-plane
# crates landed in P4b (node-api, outbox, control, sync, push, http,
# hub). Git deps on `p4b-compat` — the integration-seam additions
# (entity host payload, auth-cookie name, agent lister, node
# capabilities, hub credential env) pending merge to `main`; flip back
# to `main` once it lands. All hypha deps MUST share one branch/rev —
# mixed revisions duplicate crates and split types.
hypha-telemetry = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-secret = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-keyring = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-dotenv = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-service = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-systemd = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-node-api = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-outbox = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-control = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-sync = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-push = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-http = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }
hypha-hub = { git = "ssh://git@github.com/9aia/hypha.git", branch = "main", version = "0.1.0" }

# External dependencies — pin conservative majors/minors.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
async-trait = "0.1"
tokio = { version = "1", features = [
  "signal",
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "io-std",
  "sync",
  "time",
  "fs",
] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
semver = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
serde_norway = "0.9"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32" }
camino = { version = "1", features = ["serde1"] }
ureq = { version = "3", features = ["json"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit"] }
time = { version = "0.3", features = ["formatting"] }
# croner 4.0.3 landed <7d ago — pin 4.0.2 (chrono backend, the default).
croner = "=4.0.2"
chrono = "0.4"
chrono-tz = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
# Bundle archives (peregrin-bundle pack/unpack).
tar = "0.4"
flate2 = "1"
# OS keyring for hub node credentials: Secret Service (dbus, sync API —
# the zbus/async feature would triple the tree), Keychain, Credential
# Manager. Platform deps are target-gated inside the crate.
keyring = { version = "3.6", default-features = false, features = [
  "sync-secret-service",
  "crypto-rust",
  "apple-native",
  "windows-native",
] }
insta = { version = "1", features = ["json", "redactions"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# `cfg(coverage)` is set by cargo-llvm-cov's rustc wrapper; probes for
# host-untestable paths gate on it (see cli service backends, mains).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.clippy]
# Hard gates: deny classes that hide real bugs.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# Warn-level signal, fixed as we go.
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that cost more than they catch here.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"

[profile.dev]
# Line tables only: backtraces still symbolize, but test-binary links
# and disk usage drop sharply (full-debuginfo target/ was 25 GB).
debug = "line-tables-only"
incremental = false # this dep tree makes incremental dirs multi-GB


[profile.dev.package."*"]
debug = false # dependencies don't need debuginfo

[profile.test]
debug = "line-tables-only"
incremental = false


[profile.test.package."*"]
debug = false

[profile.release]
# Thin LTO for local `cargo xtask install` —
# shipped binaries go through `cargo build --profile dist` (release.yml).
lto = "thin"
strip = true
panic = "unwind" # keep unwind: tests + tokio supervise panics

[profile.dist]
# What we ship: maximum optimization, one codegen unit.
inherits = "release"
lto = "fat"
codegen-units = 1
