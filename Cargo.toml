    "crates/peregrin-config-toml",
    "crates/peregrin-config-yaml",
    "crates/peregrin-core",
    "crates/peregrin-driver",
    "crates/peregrin-driver-agent",
    "crates/peregrin-driver-council",
    "crates/peregrin-driver-git",
    "crates/peregrin-driver-github-webhook",
    "crates/peregrin-driver-http",
    "crates/peregrin-driver-human",
    "crates/peregrin-driver-schedule",
    "crates/peregrin-driver-shell",
    "crates/peregrin-driver-sturn",
    "crates/peregrin-driver-subworkflow",
    "crates/peregrin-engine",
    "crates/peregrin-git",
    "crates/peregrin-http",
    "crates/peregrin-hub",
    "crates/peregrin-loader",
    "crates/peregrin-loader-yaml",
    "crates/peregrin-mcp",
    "crates/peregrin-node",
