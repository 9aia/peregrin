[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/9aia/peregrin"
description = "Generic distributed orchestration — campaigns of event-driven workflows over generic entities across paired nodes"

[workspace.dependencies]
# Internal crates.
peregrin-session = { path = "crates/peregrin-session", version = "0.1.0" }
