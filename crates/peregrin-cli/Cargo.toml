[package]
name = "peregrin-cli"
description = "The peregrin CLI — node ops over /api/*, sessions/projects/push verbs, pairing, service management, and serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `mcp` embeds pavo-driver-kit's surface layer — the `mcp` argv verb
# serves this driver's ops manifest as MCP tools on stdio, equivalent
# to the standalone tamias-driver-mcp surface driver minus the
# PATH/discovery hop. (`cli` is NOT a feature: it's the tamias
# `bins[]` shim verb — an engine passthrough that needs nothing
# optional.) default = ops driver + `run`/`cli` passthroughs only.
default = []
mcp = ["pavo-driver-kit/mcp"]

[dependencies]
sepia-core.workspace = true
sepia-acp.workspace = true
sepia-session.workspace = true
sepia-convert.workspace = true
sepia-driver.workspace = true
sepia-host.workspace = true
tamias-core.workspace = true
tamias-store-local.workspace = true
tamias-cache-local.workspace = true
peregrin-config.workspace = true
peregrin-config-toml.workspace = true
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
peregrin-core.workspace = true
hypha-dotenv.workspace = true
peregrin-engine.workspace = true
peregrin-git.workspace = true
peregrin-http.workspace = true
hypha-keyring.workspace = true
peregrin-node.workspace = true
peregrin-queue.workspace = true
peregrin-queue-sqlite.workspace = true
hypha-secret.workspace = true
tamias-source.workspace = true
tamias-source-fs.workspace = true
tamias-source-git.workspace = true
tamias-source-http.workspace = true
tamias-install.workspace = true
peregrin-store.workspace = true
peregrin-store-json.workspace = true
hypha-systemd.workspace = true
hypha-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
ureq.workspace = true
time.workspace = true
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }
# The pavo wire contract + driver-authoring kit — the `serve` loop
# and manifest/ViewSpec/QueryBinding builders behind
# `tamias-driver-peregrin`'s pavo surface. Git deps so
# `cargo install --git` works without a sibling ../pavo checkout;
# `rev` pins the surface-driver layer (`pavo_driver_kit::surface`).
pavo-protocol = { git = "ssh://git@github.com/9aia/pavo.git", rev = "a7aff58c0f4ef902df99dbd56a8eddad907bcf0b", version = "0.1.0" }
pavo-driver-kit = { git = "ssh://git@github.com/9aia/pavo.git", rev = "a7aff58c0f4ef902df99dbd56a8eddad907bcf0b", version = "0.1.0" }
[dev-dependencies]
tempfile.workspace = true
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-peregrin serve` binary.
pavo-testkit = { git = "ssh://git@github.com/9aia/pavo.git", rev = "a7aff58c0f4ef902df99dbd56a8eddad907bcf0b" }
sepia-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[[bin]]
name = "tamias-driver-peregrin"
path = "src/bin/tamias-driver-peregrin.rs"
