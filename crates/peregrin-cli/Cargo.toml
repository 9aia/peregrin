[package]
name = "peregrin-cli"
description = "The peregrin CLI — node ops over /api/*, sessions/projects/push verbs, pairing, service management, and serve"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true
[[bin]]
name = "peregrin"
path = "src/main.rs"
[dependencies]
sepia-core.workspace = true
sepia-acp.workspace = true
sepia-session.workspace = true
sepia-convert.workspace = true
sepia-driver.workspace = true
sepia-host.workspace = true
peregrin-bundle.workspace = true
peregrin-config.workspace = true
peregrin-config-toml.workspace = true
peregrin-core.workspace = true
peregrin-dotenv.workspace = true
peregrin-engine.workspace = true
peregrin-git.workspace = true
peregrin-http.workspace = true
peregrin-keyring.workspace = true
peregrin-node.workspace = true
peregrin-secret.workspace = true
peregrin-source.workspace = true
peregrin-source-fs.workspace = true
peregrin-source-git.workspace = true
peregrin-source-http.workspace = true
peregrin-systemd.workspace = true
peregrin-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
ureq.workspace = true
time.workspace = true
nix = { version = "0.29", default-features = false, features = ["fs", "user"] }
[dev-dependencies]
tempfile.workspace = true
sepia-testkit.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
