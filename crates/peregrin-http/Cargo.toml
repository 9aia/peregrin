[package]
name = "peregrin-http"
description = "Peregrin HTTP API — axum driving adapter the peregrin-node daemon mounts (port of apps/server)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true
[dependencies]
sepia-acp.workspace = true
sepia-session.workspace = true
peregrin-session.workspace = true
sepia-convert.workspace = true
sepia-core.workspace = true
sepia-meta.workspace = true
sepia-proto.workspace = true
peregrin-push.workspace = true
peregrin-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
axum = "0.8"
http-body-util = "0.1"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
form_urlencoded = "1"
nix = { version = "0.29", default-features = false, features = ["hostname", "user"] }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile.workspace = true
sepia-testkit.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
