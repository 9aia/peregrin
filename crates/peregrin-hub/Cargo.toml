[package]
name = "peregrin-hub"
description = "Node-API gateway — multi-node sync engine, HTTP/SSE bridges, push, auth (hypha-hub backend + peregrin kind policies)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

# The gateway machinery (sync engine, projection, outbox, entity API,
# credentials, push, HTTP/SSE bridges) lives in `hypha-hub` (PL-005
# P4b). This crate keeps the Peregrin-specific half: the
# `PEREGRIN_*` env contract mapped onto `hypha_hub::HubConfig`, the
# sepia-session/campaign `KindPolicy` registry, and the
# `peregrin-hub` binary.
[dependencies]
hypha-hub.workspace = true
hypha-http.workspace = true
hypha-sync.workspace = true
hypha-telemetry.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
