[package]
name = "peregrin-hub"
description = "SSR host binary — serves the peregrin-web Leptos UI and bridges the node API over HTTP"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true
[dependencies]
peregrin-web = { workspace = true, features = ["ssr"] }
peregrin-web-core.workspace = true
leptos = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ureq.workspace = true
futures.workspace = true
form_urlencoded = "1"
async-trait.workspace = true
peregrin-control.workspace = true
peregrin-sync.workspace = true
peregrin-outbox.workspace = true
peregrin-push.workspace = true
sepia-meta.workspace = true
peregrin-telemetry.workspace = true
keyring.workspace = true
uuid = { workspace = true, features = ["v4"] }
[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
sepia-testkit.workspace = true
sepia-driver-devin.workspace = true
sepia-core.workspace = true
peregrin-http = { workspace = true }
ureq = { workspace = true }
tempfile = { workspace = true }
thirtyfour.workspace = true
# cargo-leptos builds the bin with `--features ssr` — a no-op here
# (peregrin-web already enables its `ssr` feature) that only needs to
# exist for the flag to resolve.
[features]
default = []
ssr = ["peregrin-web/ssr"]
