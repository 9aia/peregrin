[package]
name = "peregrin-mcp"
description = "The agent control surface — MCP stdio server exposing the substrate verbs (campaign run/validate, bundle store, run-log observability)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true
[[bin]]
name = "peregrin-mcp"
path = "src/main.rs"

[dependencies]
# Pinned to the pre-provider tamias rev: this crate recomposes the old
# two-phase `resolve`/`fetch` source API (`SourceRef`, `Resolved`,
# `overlay`, `dir_digest`) which the workspace rev (provider schema +
# shared install pipeline) removed. Migrating `bundle_install` onto
# `tamias-install` is a separate task — the revs coexist as distinct
# sources (tamias-core 0.1.0 vs 0.1.1) and no tamias types cross crates.
tamias-core = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
tamias-store-local = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
tamias-cache-local = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
peregrin-core.workspace = true
peregrin-engine.workspace = true
peregrin-node.workspace = true
tamias-source = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
tamias-source-fs = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
tamias-source-git = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
tamias-source-http = { git = "ssh://git@github.com/9aia/tamias.git", rev = "f31a2b0fe3c480df385e660ec1c001b818dceecc", version = "0.1" }
peregrin-store.workspace = true
peregrin-store-json.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
