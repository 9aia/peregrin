[package]
name = "peregrin-node"
description = "The headless node daemon — composes driver discovery, the control plane, the meta overlay, and the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `bupha` — host the `kind="ci-job"` entity plane (bupha's CI-job
# semantics over hypha's EntityPlane port, P-002). Default on: the
# plane is inert until ci-job entities are created, and the ingress
# side (`libraries/ci-ingress`) needs it resident to enqueue.
default = ["bupha"]
bupha = ["dep:bupha-plane"]

[dependencies]
bupha-plane = { workspace = true, optional = true }
sepia-acp.workspace = true
peregrin-session.workspace = true
peregrin-bus.workspace = true
peregrin-core.workspace = true
peregrin-driver.workspace = true
hypha-dotenv.workspace = true
hypha-keyring.workspace = true
hypha-secret.workspace = true
peregrin-driver-agent.workspace = true
peregrin-driver-council.workspace = true
peregrin-driver-http.workspace = true
peregrin-driver-human.workspace = true
peregrin-driver-github-webhook.workspace = true
peregrin-driver-sturn.workspace = true
peregrin-driver-git.workspace = true
peregrin-driver-schedule.workspace = true
peregrin-driver-subworkflow.workspace = true
peregrin-sink-github-status.workspace = true
peregrin-driver-shell.workspace = true
peregrin-engine.workspace = true
peregrin-loader.workspace = true
peregrin-loader-yaml.workspace = true
peregrin-queue.workspace = true
peregrin-queue-sqlite.workspace = true
peregrin-store.workspace = true
peregrin-store-json.workspace = true
thiserror.workspace = true
sepia-session.workspace = true
sepia-core.workspace = true
sepia-host.workspace = true
sepia-driver.workspace = true
sepia-meta.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
sepia-convert.workspace = true
peregrin-http.workspace = true
hypha-http.workspace = true
hypha-node-api.workspace = true
hypha-telemetry.workspace = true
futures.workspace = true
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
axum = "0.8"
chrono.workspace = true
uuid.workspace = true
[dev-dependencies]
tempfile.workspace = true
sepia-driver-devin.workspace = true
sepia-testkit.workspace = true
tokio = { workspace = true, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
ureq.workspace = true
