# 01-parallel-checks: run two independent checks in parallel, then fan-in.
# Demonstrates: parallel fan-out from `start`, fan-in with `mode: all`,
# conditional branching, and the shell driver's exit-code → event convention.
#
# Run:
#   node apps/cli/dist/cli.mjs validate examples/00-foundations/01-parallel-checks.yaml

name: parallel-checks

config:
  lint_ok: true
  test_ok: true

nodes:
  - id: lint
    driver: shell
    on: [start]
    emits: [lint.passed, lint.failed]
    with:
      emit:
        0: lint.passed
        default: lint.failed
      cmd: |
        if [ "${config.lint_ok}" = "true" ]; then
          echo "no lint issues"
          exit 0
        else
          echo "lint errors"
          exit 1
        fi

  - id: test
    driver: shell
    on: [start]
    emits: [test.passed, test.failed]
    with:
      emit:
        0: test.passed
        default: test.failed
      cmd: |
        if [ "${config.test_ok}" = "true" ]; then
          echo "all tests green"
          exit 0
        else
          echo "tests broken"
          exit 1
        fi

  - id: summarize
    driver: shell
    on: [lint.passed, test.passed]
    mode: all
    emits: [summary.ready]
    with:
      cmd: "echo 'Lint and tests passed'"

  - id: report-failure
    driver: shell
    on: [lint.failed, test.failed]
    mode: any
    emits: [summary.ready]
    with:
      cmd: "echo 'One or more checks failed'"

  - id: finish
    driver: shell
    on: [summary.ready]
    emits: [workflow.done]
    with:
      cmd: "echo 'Parallel checks complete'"
