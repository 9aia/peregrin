# 11-circuit-breaker: stop hitting a failing API after repeated failures.
# Demonstrates: `circuit_breaker` configuration, `on_trip` event, and fallback.
#
# The `call-api` node will retry up to `threshold` failures, then emit
# `circuit.open` instead of continuing to call the service. The `fallback`
# node runs while the circuit is open.
#
# Run (safe dry-run):
#   node apps/cli/dist/cli.mjs validate examples/10-patterns/11-circuit-breaker.yaml

name: circuit-breaker

nodes:
  - id: call-api
    driver: http
    on: [start]
    emits: [api.success, api.failed]
    circuit_breaker:
      threshold: 3
      reset_after: 60
      on_trip: circuit.open
    with:
      method: GET
      url: "https://httpbin.org/status/500"

  - id: fallback
    driver: shell
    on: [circuit.open]
    emits: [circuit.handled]
    with:
      cmd: "echo 'Circuit is open; using cached fallback'"

  - id: use-result
    driver: shell
    on: [api.success]
    emits: [circuit.handled]
    with:
      cmd: "echo 'API call succeeded'"

  - id: finish
    driver: shell
    on: [circuit.handled]
    emits: [workflow.done]
    with:
      cmd: "echo 'Circuit breaker example complete'"
