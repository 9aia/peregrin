# 12-polling: check a condition periodically until it is met.
# Demonstrates: the `poll:` sugar and a self-stopping loop.
#
# The `check-readiness` node polls every 5 seconds until the sentinel file
# `/tmp/peregrin-service-ready` exists. The final `finish` node runs once the
# service reports ready.
#
# To run for real, create the sentinel file while the workflow is polling:
#   touch /tmp/peregrin-service-ready
#
# Run (dry-run):
#   node apps/cli/dist/cli.mjs validate examples/10-patterns/12-polling.yaml

name: polling

nodes:
  - id: check-readiness
    driver: shell
    poll:
      interval: 5
      until: [service.ready]
    emits: [service.ready]
    with:
      cmd: |
        if [ -f /tmp/peregrin-service-ready ]; then
          echo "ready"
          exit 0
        fi
        echo "not ready"
        exit 1

  - id: finish
    driver: shell
    on: [service.ready]
    emits: [workflow.done]
    with:
      cmd: "rm -f /tmp/peregrin-service-ready && echo 'service is ready'"
