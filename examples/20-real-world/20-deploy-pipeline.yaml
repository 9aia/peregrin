# 20-deploy-pipeline: build, test, gate, deploy, and notify.
# Demonstrates: parallel checks, a human approval gate, conditional rollback,
# and multi-actor orchestration.
#
# Run (dry-run, safe):
#   node apps/cli/dist/cli.mjs validate examples/20-real-world/20-deploy-pipeline.yaml
#
# Required for real run:
#   - A deploy script on PATH or replace `deploy.sh` with the real command.
#   - The human gate reads from stdin.

name: deploy-pipeline

config:
  target: production

nodes:
  - id: build
    driver: shell
    on: [start]
    emits: [build.done, build.failed]
    with:
      emit:
        0: build.done
        default: build.failed
      cmd: "echo 'Building for ${config.target}'"

  - id: test
    driver: shell
    on: [start]
    emits: [test.done, test.failed]
    with:
      emit:
        0: test.done
        default: test.failed
      cmd: "echo 'Running tests'"

  - id: approve
    driver: human
    on: [build.done, test.done]
    mode: all
    emits: [approve.approved, approve.rejected]
    with:
      prompt: "Approve deploy to ${config.target}? (yes/no)"
      expect: "yes"
      timeout: 300
      emit_ok: approve.approved
      emit_reject: approve.rejected

  - id: deploy
    driver: shell
    on: [approve.approved]
    emits: [deploy.done, deploy.failed]
    with:
      emit:
        0: deploy.done
        default: deploy.failed
      cmd: "echo 'Deploying to ${config.target}'"

  - id: notify-success
    driver: shell
    on: [deploy.done]
    emits: [deploy.complete]
    with:
      cmd: "echo 'Deployment to ${config.target} succeeded'"

  - id: rollback
    driver: shell
    on: [deploy.failed]
    emits: [deploy.complete]
    with:
      cmd: "echo 'Rolling back ${config.target}'"

  - id: finish
    driver: shell
    on: [deploy.complete]
    emits: [workflow.done]
    with:
      cmd: "echo 'Deploy pipeline finished'"
