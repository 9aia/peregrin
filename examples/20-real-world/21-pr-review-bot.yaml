# 21-pr-review-bot: fetch a PR, run checks, ask an agent to review, and post.
# Demonstrates: `http` driver, `agent` driver, fan-out, and conditional review.
#
# Set `secret.GITHUB_TOKEN` and `config.repo` / `config.pr_number` to run for real.
#
# Run (safe dry-run):
#   node apps/cli/dist/cli.mjs validate examples/20-real-world/21-pr-review-bot.yaml

name: pr-review-bot

config:
  repo: "acme/widget"
  pr_number: 42

nodes:
  - id: fetch-pr
    driver: http
    on: [start]
    emits: [pr.fetched, pr.fetch_failed]
    params:
      emit:
        200: pr.fetched
        default: pr.fetch_failed
      method: GET
      url: "https://api.github.com/repos/${config.repo}/pulls/${config.pr_number}"
      headers:
        Accept: application/vnd.github.v3+json
      auth:
        type: bearer
        secret: GITHUB_TOKEN

  - id: lint
    driver: shell
    on: [pr.fetched]
    emits: [lint.passed, lint.failed]
    params:
      emit:
        0: lint.passed
        default: lint.failed
      cmd: "echo 'Running lint'"

  - id: test
    driver: shell
    on: [pr.fetched]
    emits: [test.passed, test.failed]
    params:
      emit:
        0: test.passed
        default: test.failed
      cmd: "echo 'Running tests'"

  - id: agent-review
    driver: agent
    on: [lint.passed, test.passed]
    mode: all
    emits: [review.approved, review.requested]
    params:
      runner: devin
      prompt: "Review PR #${config.pr_number} in ${config.repo}. Approve if the diff is safe."
      permission_mode: safe
      emit:
        0: review.approved
        default: review.requested

  - id: post-approval
    driver: http
    on: [review.approved]
    emits: [bot.done]
    params:
      method: POST
      url: "https://api.github.com/repos/${config.repo}/issues/${config.pr_number}/comments"
      auth:
        type: bearer
        secret: GITHUB_TOKEN
      json:
        body: "Peregrin bot approved after lint, tests, and agent review."

  - id: request-changes
    driver: http
    on: [review.requested]
    emits: [bot.done]
    params:
      method: POST
      url: "https://api.github.com/repos/${config.repo}/issues/${config.pr_number}/comments"
      auth:
        type: bearer
        secret: GITHUB_TOKEN
      json:
        body: "Peregrin bot requested changes after agent review."

  - id: finish
    driver: shell
    on: [bot.done]
    emits: [workflow.done]
    params:
      cmd: "echo 'PR review bot finished'"
