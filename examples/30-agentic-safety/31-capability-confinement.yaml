# 31-capability-confinement: an AI generates nodes, but the workflow caps block the unsafe one.
# Demonstrates: capability policies, self-attested node caps, and the `runner` driver.
#
# The workflow denies all shell commands by default except `echo *`. The
# `generate` node produces a safe `echo` node and a dangerous `rm -rf` node.
# After review, the `runner` injects both, but the dangerous one is rejected
# with `capability.violation` before it can run.
#
# The `generate` and `review` handlers must be implemented to return a
# `nodes` payload. See `40-meta/40-self-modifying-scaffold.yaml` for the
# meta-workflow pattern.
#
# Run (dry-run):
#   node apps/cli/dist/cli.mjs validate examples/30-agentic-safety/31-capability-confinement.yaml

name: capability-confinement

# --- the workflow's immutable capability boundary ---
capabilities:
  default_policy: deny
  shell:
    allow: ["echo *"]

nodes:
  - id: generate
    driver: python
    on: [start]
    emits: [generate.done]
    params:
      module: examples.conf
      function: generate

  - id: review
    driver: python
    on: [generate.done]
    emits: [review.done]
    params:
      module: examples.conf
      function: review

  - id: inject
    driver: runner
    on: [review.done]
    emits: [inject.done]

  - id: report-block
    driver: shell
    on: [capability.violation]
    emits: [confinement.demonstrated]
    params:
      cmd: |
        echo "=== CAPABILITY CONFINEMENT DEMONSTRATED ==="
        echo "Blocked node:  ${event.payload.node}"
        echo "Violations:    ${event.payload.violations}"

  - id: alert-breach
    driver: shell
    on: [safe-op.done]
    emits: [confinement.demonstrated]
    params:
      cmd: |
        echo "Safe node (echo) ran; dangerous node (rm) was blocked."

  - id: finish
    driver: shell
    on: [confinement.demonstrated]
    emits: [workflow.done]
    params:
      cmd: "echo 'Capability confinement example complete'"
