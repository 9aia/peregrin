# DEPRECATED (PL-015 WS3): raw git/gh/agent calls violate the
# ownership boundaries — migrate to sepia sessions via /api/sessions/run (PL-015). Kept for common/new-feat,
# common/refactor and meta/workflows/create until those move to
# workspace/workflows/.

# meta/snippets/agent/generate: generic generator agent.
# Parent must set params.prompt or params.prompt_file.
annotations:
  title: Generate agent
  description: Generic generator agent that creates new content from a prompt or prompt file.
  author: peregrin
  tags: [agent, generate, snippet]
  since: "0.1.0"
  see: project/adrs/0029-stdlib-design.md

id: agent.generate
driver: agent
on: [start]
emits: [agent.generate.done, agent.generate.failed]
max_fires: 1
retry:
  max_attempts: 2
  delay: 1000
  backoff: fixed
params:
  runner: "${config.agent_runner:-devin}"
  permission_mode: dangerous
  trust: false
  timeout: 900
  cwd: "${config.repo:-.}"
  emit:
    0: agent.generate.done
    default: agent.generate.failed
