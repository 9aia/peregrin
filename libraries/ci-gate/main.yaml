- id: ci.route
  driver: shell
  on:
  - push
  max_fires: unlimited
  emits:
  - push.**
  - route.unmatched
  params:
    cmd: 'true'
    emit:
      '0': push.${event.payload.repo}.${event.payload.ref}.${event.payload.clone_url}.${event.payload.sha}
      default: route.unmatched
- id: ci.handl-lang-host
  driver: git
  on:
  - push.handl-lang/host.refs/heads/main.**.*
  max_fires: unlimited
  emits:
  - ci.handl-lang-host.done
  - ci.handl-lang-host.failed
  params:
    url: ${event.match.1}
    sha: ${event.match.2}
    base: ~/.local/share/peregrin/worktrees
    token_env: BUPHA_TOKEN
    inner:
      driver: shell
      params:
        cmd: bash /home/luis/GitHub/handl-lang/host/scripts/ci.sh
        timeout: 600
    emit:
      '0': ci.handl-lang-host.done
      default: ci.handl-lang-host.failed
- id: ci.handl-lang-host.pending
  driver: github-status
  on:
  - push.handl-lang/host.refs/heads/main.**.*
  max_fires: unlimited
  emits:
  - ci.handl-lang-host.status-posted
  params:
    repo: handl-lang/host
    context: ci/bupha
    token_env: BUPHA_TOKEN
    sha: ${event.match.2}
    state: pending
- id: ci.handl-lang-host.status
  driver: github-status
  on:
  - ci.handl-lang-host.done
  - ci.handl-lang-host.failed
  - ci.handl-lang-host.failed.*
  max_fires: unlimited
  emits:
  - ci.handl-lang-host.status-posted
  params:
    repo: handl-lang/host
    context: ci/bupha
    token_env: BUPHA_TOKEN
    sha: ${event.payload.sha:-${event.match.1}}
- id: ci.handl-lang-graphopt
  driver: git
  on:
  - push.handl-lang/graphopt.refs/heads/main.**.*
  max_fires: unlimited
  emits:
  - ci.handl-lang-graphopt.done
  - ci.handl-lang-graphopt.failed
  params:
    url: ${event.match.1}
    sha: ${event.match.2}
    base: ~/.local/share/peregrin/worktrees
    token_env: BUPHA_TOKEN
    inner:
      driver: shell
      params:
        cmd: TORCHINDUCTOR_COMPILE_THREADS=1 bash /home/luis/GitHub/handl-lang/graphopt/scripts/gates.sh && TORCHINDUCTOR_COMPILE_THREADS=1 bash /home/luis/GitHub/handl-lang/graphopt/ci.sh
        timeout: 600
    emit:
      '0': ci.handl-lang-graphopt.done
      default: ci.handl-lang-graphopt.failed
