# ci-gate — bupha's CI gate as a peregrin bundle (ADR-0080/ADR-0081).
# `tamias install <ref>` fetches this; `tamias deploy ci-gate` renders
# the provider service unit(s) and `tamias-driver-peregrin deploy`
# generates the operator node config (`~/.config/peregrin/ci-gate.yaml`)
# from the `provider:` block below.
name: ci-gate
version: "0.1.0"
# `peregrin-bundle` routes install/deploy/uninstall through
# `tamias-driver-peregrin` (capabilities: types ["peregrin-bundle"]).
type: peregrin-bundle
description: >-
  Push-to-verdict CI gate: github-webhook/sturn push event → detached
  worktree at the pushed sha → inner shell run → GitHub commit status
  (ci/<campaign>). Latest-wins supersede on {repo}:{ref} with
  cancel_running, mirroring bupha's queue semantics.

# The declarative runtime spec — `tamias deploy` renders each
# `services[]` entry as a per-user systemd unit named
# `<provider.name>-<service>` (here `peregrin-campaign.service`, kept
# distinct from any hand-made `ci-gate.service`).
provider:
  # SHARED provider identity (T8-7): every `peregrin-bundle` declares
  # `provider.name: peregrin` so all their `campaign` services render
  # ONE unit — `peregrin-campaign.service` — whose ExecStart is
  # `campaign serve ~/.config/peregrin/serve`, a directory the
  # deploy driver fills with one generated node config per installed
  # bundle. `campaign serve` hosts them all on ONE webhook listener
  # (demux by repository.full_name). Shared-unit services MUST keep
  # `exec` identical across bundles — last deploy wins the unit file.
  name: peregrin
  services:
    # The campaign host: serve every generated config in the host dir.
    # `--listen`/`--path` are the shared listener's bind; the generated
    # github-webhook node's own listen/path params are ignored under
    # `campaign serve` (the daemon's flags govern the socket). history/
    # queue dirs are namespaced per campaign inside.
    - name: campaign
      exec: >-
        peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Declarative only — forge-hook registration is the deploy
    # driver's job (T8-5); nothing here performs live registration.
    # `public_url` fronts the shared listener (`listen`/`path` must
    # match the unit's `--listen`/`--path` — ONE socket serves every
    # bundle; each bundle keeps its own public_url/tunnel hostname).
    - public_url: https://ci.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks:
        - forge: github
          repo: 9aia/peregrin
          events: [push]
  # Advisory verb hints for `tamias provider list`/`tamias run` —
  # no health probe: the campaign daemon serves only the hook path,
  # there is no /health endpoint to curl.
  verbs: [run, logs]
