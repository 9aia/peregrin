# ci-ingress — forge webhook → `kind="ci-job"` enqueue (P-002 §4,
# ADR-0007, bupha T-058/T-063). A verified `push`/`pull_request`
# delivery becomes a `POST /api/entities {kind:"ci-job"}` on the
# peregrin node that hosts the ci-job plane (`peregrin serve` with
# the `bupha` feature) — create IS `ci.enqueue`, and the deterministic
# entity id `ci:{key}:{sha}:{attempt}` dedups webhook replays for
# free.
#
# Shape mirrors `libraries/ci-gate`: the `github-webhook` node emits
# raw `push`/`pull_request` events; `ci.route` re-emits them typed
# (`{event}.{repo}.{ref}.{clone_url}.{sha}`) so per-repo `on:`
# patterns can pick them apart; `ci.enqueue*` are the generic
# catch-alls that POST the indexDoc. Per-repo job specs still belong
# in the worker's fleet.toml — a spec-armed plane
# (`CiJobPlane::with_watched`, fed by `ci_fleet::fleet_specs` from
# `PEREGRIN_BUPHA_CONFIG`/`BUPHA_CONFIG`/`~/.config/bupha/bundles/`)
# resolves queue/runsOn/runner/context/maxAttempts plane-side and
# gates ref/event, so these nodes only carry what the wire event
# knows. See README.md.
name: ci-ingress

# Operator-facing knobs (see params.schema.json + README.md).
config:
  # Base URL of the node hosting the ci-job entity plane — the
  # `peregrin serve` daemon (`/api/entities` is the hypha substrate
  # surface). Same-host deployments use loopback.
  node_url: "http://127.0.0.1:7700"
  # ci-job indexDoc defaults applied to EVERY watched repo. `queue`
  # is the lane policy ("latest" = newest push wins, "all" = bounded
  # FIFO); `context` is the forge status label prefix. On a
  # spec-armed plane the fleet config overwrites both per repo —
  # these are the fallback for keys with no fleet entry.
  queue: "latest"
  context: "ci/bupha"

# Secret NAMES the drivers may resolve — the node bearer token plus
# one webhook HMAC secret per watched repo (`BUPHA_WH_<OWNER>_<REPO>`
# convention). Values never appear here; they live in the operator's
# env file (`~/.config/peregrin/env`).
capabilities:
  secrets:
    - PEREGRIN_NODE_TOKEN
    - BUPHA_WH_9AIA_BUPHA
    - BUPHA_WH_9AIA_TAMIAS
    - BUPHA_WH_9AIA_MYCO
    - BUPHA_WH_9AIA_PEREGRIN
    - BUPHA_WH_9AIA_CUORA

nodes:
# --- ingress: verified forge pushes + pull requests --------------------
- id: ci.ingress.webhook
  driver: github-webhook
  on:
  - start
  emits:
  - ci.ingress.webhook.listening
  - push
  - pull_request
  params:
    # Under `campaign serve` the daemon's --listen/--path govern the
    # ONE shared socket — these are ignored there (same as ci-gate).
    listen: 127.0.0.1:29173
    path: /hook
    # Watched repos — keep in lockstep with the worker fleet's
    # [[repo]] set (bupha libraries/ci-gate/fleet.toml): a watched
    # repo with no fleet spec still enqueues (indexDoc defaults
    # apply), and a fleet repo nobody watches never sees pushes.
    # `secret_env` names the secret, never the value.
    # `pull_request` deliveries are always parsed;
    # `pull_request_actions` (default opened,synchronize,
    # reopened) filters which actions inject.
    repos:
    - name: 9aia/bupha
      secret_env: BUPHA_WH_9AIA_BUPHA
    - name: 9aia/tamias
      secret_env: BUPHA_WH_9AIA_TAMIAS
    - name: 9aia/myco
      secret_env: BUPHA_WH_9AIA_MYCO
    - name: 9aia/peregrin
      secret_env: BUPHA_WH_9AIA_PEREGRIN
    - name: 9aia/cuora
      secret_env: BUPHA_WH_9AIA_CUORA

# --- routing: raw events → typed `{type}.{repo}.{ref}.{url}.{sha}` ---
# The catch-all enqueues below don't need this, but per-repo enqueue
# nodes subscribe the typed kinds (ci-gate's ci.route precedent).
# `${event.type}` keeps push and pull_request kinds distinct;
# `event.match.1` = clone_url, `event.match.2` = sha (same positions
# for both — see ci.enqueue.pr for the PR ref convention).
- id: ci.route
  driver: shell
  on:
  - push
  - pull_request
  max_fires: unlimited
  emits:
  - push.**
  - pull_request.**
  - route.unmatched
  params:
    cmd: 'true'
    emit:
      '0': "${event.type}.${event.payload.repo}.${event.payload.ref}.${event.payload.clone_url}.${event.payload.sha}"
      default: route.unmatched

# --- enqueue: push → POST /api/entities (kind="ci-job") -----------------
# `key` is the worker fleet.toml `[[repo]] key` the job resolves
# against — repo full_name for whole-repo gates (`owner/name`),
# `owner/name:job` for per-job lanes. `deliveryId` carries
# X-GitHub-Delivery for audit (the deterministic entity id already
# dedups replays). `retries` re-POSTs on transport failure/5xx —
# safe because create is idempotent on the entity id.
- id: ci.enqueue
  driver: http
  on:
  - push
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.node_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_NODE_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "${event.payload.ref}"
        sha: "${event.payload.sha}"
        event: push
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "${config.queue}"
        context: "${config.context}"

# --- enqueue: pull_request → POST /api/entities (kind="ci-job") ---------
# bupha-trigger's PR convention: the job runs the PR *head* sha but
# gates on the *base* branch — `ref` is `refs/heads/<base_ref>`, the
# same ref a push to that branch would carry, so one `[[repo]]
# branch` + `events = ["push", "pull_request"]` entry covers both.
# Repos that didn't opt into pull_request never match a fleet spec's
# `events` — a spec-armed plane rejects the create (400 → http.failed
# in the log) instead of leaving an unclaimable job pending.
- id: ci.enqueue.pr
  driver: http
  on:
  - pull_request
  max_fires: unlimited
  emits:
  - http.done
  - http.failed
  params:
    url: "${config.node_url}/api/entities"
    method: POST
    timeout: 30
    retries: 3
    headers:
      authorization: "Bearer ${secret.PEREGRIN_NODE_TOKEN}"
      content-type: application/json
    body:
      kind: ci-job
      indexDoc:
        key: "${event.payload.repo}"
        repo: "${event.payload.repo}"
        ref: "refs/heads/${event.payload.base_ref}"
        sha: "${event.payload.sha}"
        event: pull_request
        sender: "${event.payload.actor}"
        deliveryId: "${event.payload.delivery_id}"
        queue: "${config.queue}"
        context: "${config.context}"
