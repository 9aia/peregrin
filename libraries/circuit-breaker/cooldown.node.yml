# circuit-breaker/cooldown.node.yml — waits `reset_after` seconds on
# `circuit.open`, then emits `circuit.half-open`. The wait is a
# `driver: delay` deferral (ADR-0018): `invoke` arms the deadline and
# returns immediately, so the run keeps processing during the cooldown
# while the timer heap holds the run open until `emits[0]` fires.
# `disarm.node.yml` clears the flag on `half-open`.
#
#   - include: ../circuit-breaker/cooldown.node.yml
#     id: mytask.circuit-cooldown
#     on: [mytask.circuit.open]
#     emits: [mytask.circuit.half-open]
#
# Gating never depended on the old blocking `sleep`: requests are held
# out by `dispatch.node.yml`'s `until: [circuit.open]` (the dispatcher
# stops forwarding the moment the circuit trips) and by
# `gate.node.yml`'s `.circuit.open` flag file, which `arm.node.yml`
# writes on `circuit.open` — independent of the cooldown timer. A
# queued request landing mid-cooldown still dies on the dispatcher or
# skips on the flag.
#
# `config.circuit.reset_after` (seconds) feeds `params.duration` — the
# driver reads `<n><unit>` strings (`500ms`, `30s`, `5m`; segments
# compose) and bare numbers as seconds.
annotations:
  title: Circuit cooldown
  description: Waits reset_after seconds after circuit.open without blocking, then emits circuit.half-open.
  author: peregrin
  tags: [circuit-breaker, resilience, preset]
  since: "0.1.0"

id: circuit-breaker.cooldown
driver: delay
max_fires: unlimited
emits: [circuit.half-open]
params:
  duration: "${config.circuit.reset_after:-60}s"
