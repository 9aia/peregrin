# docs-deploy — docs-site deployment as a peregrin bundle (PL-009 /
# P-009). `tamias install <ref>` fetches this; the bundle's main.yaml
# is a complete campaign (ingress webhook node included — see below).
name: docs-deploy
version: "0.1.0"
# `peregrin-bundle` routes install/deploy/uninstall through
# `tamias-driver-peregrin` (capabilities: types ["peregrin-bundle"]).
type: peregrin-bundle
description: >-
  Push to refs/heads/docs → detached worktree at the pushed sha →
  bun install + the repo's own docs:deploy (vitepress build →
  gh-pages) → docs/deploy commit status. Latest-wins supersede on
  {repo}:{ref} with cancel_running. Replaces the deleted GHA
  deploy.yml workflows for self-contained docs trees.

# Unlike ci-gate, the campaign yaml ships its own github-webhook
# ingress node (fixed v1 repo set, BUPHA_WH_* secret names) — so
# provider.ingress declares listen/path/public_url for the units and
# health probes but NO hooks: `tamias deploy` only generates a second
# ingress node when hooks[] names github repos, which would
# double-deliver every push.
provider:
  # SHARED provider identity (T8-7) — see ci-gate's tamias.yaml: every
  # `peregrin-bundle` declares `provider.name: peregrin` so all their
  # `campaign` services render ONE `peregrin-campaign.service` hosting
  # every bundle's generated config in `~/.config/peregrin/serve/` on
  # a single webhook listener. Keep `exec` identical to the other
  # bundles' — last deploy wins the unit file.
  name: peregrin
  services:
    # The shared campaign host. This bundle's generated config
    # (`~/.config/peregrin/serve/docs-deploy.yaml`) `include:`s
    # main.yaml, whose own github-webhook node (fixed v1 repo set)
    # joins the shared listener's repo demux — under `campaign serve`
    # the per-node listen/path params are ignored; the daemon's
    # --listen/--path govern the one socket.
    - name: campaign
      exec: >-
        peregrin campaign serve ~/.config/peregrin/serve
        --listen 127.0.0.1:29173 --path /hook
        --history-dir ~/.local/share/peregrin/serve-history
        --queue-store-dir ~/.local/share/peregrin/serve-queues
      env_file: "~/.config/peregrin/env"
      workdir: "~"
      restart: on-failure
  ingress:
    # Declarative only — forge-hook registration is the deploy
    # driver's job and stays an operator step; no hooks[] are
    # declared (see the note above — the campaign yaml owns repos[]).
    # `listen`/`path` mirror the shared unit's --listen/--path: this
    # bundle's public_url fronts the SAME listener as ci-gate's.
    - public_url: https://docs-deploy.luisfuturist.com
      listen: 127.0.0.1:29173
      path: /hook
      hooks: []
  # Advisory verb hints for `tamias provider list`/`tamias run` —
  # no health probe: the campaign daemon serves only the hook path,
  # there is no /health endpoint to curl.
  verbs: [run, logs]
