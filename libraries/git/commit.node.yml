# common/snippets/git/commit: stage and commit with a given subject/body.
# Parent must set id, on, emits, params.emit and params.env.COMMIT_SUBJECT/COMMIT_BODY.
annotations:
  title: Git commit
  description: Stage and commit changes with a given subject and body.
  author: peregrin
  tags: [git, commit, snippet]
  since: "0.1.0"
  see: project/adrs/0029-stdlib-design.md

driver: shell
id: git.commit
max_fires: 1
retry:
  max_attempts: 2
  delay: 1000
  backoff: fixed
params:
  cmd: |
    cd "${state.worktree_path}"
    git add -A
    git commit -m "${COMMIT_SUBJECT}" -m "${COMMIT_BODY:-}" --allow-empty
  timeout: 60
