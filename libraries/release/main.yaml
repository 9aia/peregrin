# release — the release pipeline campaign (bupha's `release.sh` role:
# tag → publish on main pushes — tarsi-serve release --yes).
#
# Same routed-push mechanics as ci-gate (see libraries/ci-gate's
# README): the match node re-emits a gated push as
# `push.release.<clone_url>.<sha>`; the build and sink nodes recover
# the fields via `${event.match.N}` captures.
#
# Difference from ci-gate: a release must NOT be cancelled mid-publish
# — supersede dedupes pending runs to the newest push but never kills
# the in-flight one (a half-published crate set is worse than a stale
# one). The pushed-sha worktree keeps every run hermetic.
#
# Artifact layout (stdlib split — `.node.yml`/`.snippet.yml`/
# `.field.yml`, ADR-0029):
#
#   match.node.yml              gate on repo+ref → push.release.<url>.<sha>
#   pending.node.yml            `pending` ci/<name> status on the gated sha
#   build.node.yml              worktree at pushed sha → config.cmd
#   failmap.node.yml            node.failed → <node>.failed.<sha> remap
#   status.node.yml             verdict → ci/<name> commit status
#   status-params.snippet.yml   github-status params shared by the
#                               pending/status nodes (snippet: status-params)
#   release.field.yml           config.* surface as a handl field pattern
#
# `nodes:` below is the wiring list — bare `include:`s of the sibling
# `.node.yml` files. Loading this file as the top document also
# auto-discovers those artifacts (dedupe keeps one copy); the explicit
# includes keep the bundle intact when `main.yaml` is itself `include:`d
# into another campaign. The `snippets:` entry does the same for
# `status-params` — node-level `snippet:` refs resolve either way.
name: release

config:
  name: release                     # status context base: ci/<name>
  repo: ""                          # owner/name to release; "" = any watched repo
  ref: "refs/heads/main"            # the release ref
  status_repo: ""                   # bupha's redirect; "" = config.repo
  cmd: "tarsi-serve release --yes"  # tarsi release expertise (plan → publish); tarsi.toml in the repo configures units
  worktree_base: "~/.local/share/peregrin/worktrees"
  token_env: "GITHUB_TOKEN"         # NAME of the forge-token secret — never a value
  timeout: 600

# Pending jobs dedupe to the newest push (a stale queued release is
# pointless), but an in-flight publish is never cancelled.
supersede:
  key: "{repo}:{ref}"
  mode: latest-wins
  cancel_running: false

annotations:
  title: Release pipeline
  description: >-
    Push to the release ref → detached worktree → release command
    (tag + publish per the repo's tarsi.toml) → GitHub commit status.
  since: "0.1.0"
  see: project/adrs/0081-bupha-peregrin-migration-inventory-queue-semantics-drivers-sinks-ops.md

# The github-status params shared by release.pending/release.status —
# declared here (not just discovered) so the bundle survives being
# `include:`d into another campaign's document.
snippets:
  status-params:
    include: ./status-params.snippet.yml

nodes:
  - include: ./match.node.yml
  - include: ./pending.node.yml
  - include: ./build.node.yml
  - include: ./failmap.node.yml
  - include: ./status.node.yml
