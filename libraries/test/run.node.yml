# common/snippets/test/run: run the test suite in the worktree.
# Parent must set id, on, emits and params.emit.
annotations:
  title: Test runner
  description: Run the test suite in the current worktree.
  author: peregrin
  tags: [test, run, snippet]
  since: "0.1.0"
  see: project/adrs/0029-stdlib-design.md

driver: shell
id: test.run
max_fires: 1
retry:
  max_attempts: 2
  delay: 1000
  backoff: fixed
params:
  cmd: |
    cd "${state.worktree_path}"
    ${config.test_cmd:-bun test}
  timeout: 600
