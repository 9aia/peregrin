# fix: spawn an agent to apply the fix. Retry loop via max_fires.
# Uses driver: agent with ${node.fires} for attempt numbering —
# no /tmp/handl-bugfix-attempt counter file needed.
#
# Fires on agent.investigate.done OR test.check.failed (retry).
# max_fires bounds the retry loop (default 3, override via config.max_fix_attempts).

id: fix
driver: agent
on: [agent.investigate.done, test.check.failed]
emits: [agent.fix.done, agent.fix.failed]
max_fires: 3
params:
  runner: devin
  prompt_file: examples/bugfix-v2/fix.prompt.md
  permission_mode: dangerous
  trust: false
  timeout: 600
  cwd: "${state.worktree_path}"
  emit:
    0: agent.fix.done
    default: agent.fix.failed
