# investigate: spawn a normal-mode agent to find the root cause.
# Uses driver: agent instead of the shell envsubst + devin -p pattern.
# The prompt file is resolved relative to cwd; ${state.worktree_path} is
# passed as cwd so the agent runs in the worktree.
#
# Compare with the original investigate.node.yml (~10 lines of shell).

id: investigate
driver: agent
on: [test.install.done]
emits: [agent.investigate.done, bugfix-v2.aborted]
with:
  runner: devin
  prompt_file: examples/bugfix-v2/investigate.prompt.md
  permission_mode: normal
  trust: false
  timeout: 300
  cwd: "${state.worktree_path}"
  emit:
    0: agent.investigate.done
    default: bugfix-v2.aborted
