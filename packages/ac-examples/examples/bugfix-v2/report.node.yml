# report: print completion summary.
# Reads ${state.branch} and ${state.worktree_path} — no /tmp/handl-bugfix-env needed.

id: report
driver: shell
on: [git.pr.created]
emits: [bugfix-v2.complete]
params:
  cmd: |
    echo "════════════════════════════════════════"
    echo "  BUGFIX COMPLETE"
    echo "════════════════════════════════════════"
    echo "  Branch:   ${state.branch}"
    echo "  Worktree: ${state.worktree_path}"
    echo "  PR:       ${event.payload.stdout}"
    echo "════════════════════════════════════════"
