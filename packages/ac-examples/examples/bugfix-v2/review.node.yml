# review: spawn a normal-mode agent to review the diff.
# Uses driver: agent instead of the shell envsubst + devin -p pattern.

id: review
driver: agent
on: [git.commit.done]
emits: [agent.review.done, bugfix-v2.aborted]
with:
  runner: devin
  prompt_file: examples/bugfix-v2/review.prompt.md
  permission_mode: normal
  trust: false
  timeout: 300
  cwd: "${state.worktree_path}"
  emit:
    0: agent.review.done
    default: bugfix-v2.aborted
