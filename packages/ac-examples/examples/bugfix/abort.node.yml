# yaml-language-server: $schema=.handl/generated/schemas/nodes/abort.schema.json
# abort: print abort summary when any node fails.
# Reusable by any workflow — listens for <workflow>.aborted.

id: abort
driver: shell
on: [bugfix.aborted]
emits: [bugfix.failed]
params:
  cmd: |
    source /tmp/handl-bugfix-env 2>/dev/null || true
    echo "════════════════════════════════════════"
    echo "  BUGFIX ABORTED"
    echo "════════════════════════════════════════"
    echo "  Reason: ${event.payload.stderr}"
    echo "  Worktree: ${WORKTREE_PATH:-none}"
    echo "════════════════════════════════════════"
