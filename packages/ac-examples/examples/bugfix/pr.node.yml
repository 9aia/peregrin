# yaml-language-server: $schema=.ac/generated/schemas/nodes/pr.schema.json
# pr: push branch and create a GitHub PR.
# Reusable by any workflow that needs to open a PR.
#
# Expects env:
#   BUG_DESCRIPTION — used in PR title and body
#
# Emits: pr.created | <workflow>.aborted

id: pr
driver: shell
on: [review.done]
emits: [pr.created, bugfix.aborted]
with:
  cmd: |
    source /tmp/ac-bugfix-env
    cd "$WORKTREE_PATH"

    git push -u origin "$BRANCH"

    SUMMARY=$(cat /tmp/ac-bugfix-fix-summary.txt 2>/dev/null || echo "$BUG_DESCRIPTION")
    REVIEW=$(cat /tmp/ac-bugfix-review.txt 2>/dev/null || echo "review complete")

    PR_URL=$(gh pr create \
      --title "fix: $BUG_DESCRIPTION" \
      --body "## Summary
    $SUMMARY

    ## Bug
    $BUG_DESCRIPTION

    ## Review
    $REVIEW

    #### Test plan
    - [ ] vp check passes
    - [ ] Targeted tests pass
    - [ ] Manual verification of the fix

    Generated with [Devin](https://devin.ai) via agent-campaign bugfix workflow" \
      --base main \
      --head "$BRANCH")

    echo "$PR_URL"
  emit:
    0: pr.created
    default: bugfix.aborted
  timeout: 120
