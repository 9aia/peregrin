# yaml-language-server: $schema=.handl/generated/schemas/nodes/report.schema.json
# report: print completion summary.
# Reusable by any workflow — change the header text via merge override.

id: report
driver: shell
on: [pr.created]
emits: [bugfix.complete]
params:
  cmd: |
    source /tmp/handl-bugfix-env
    echo "════════════════════════════════════════"
    echo "  BUGFIX COMPLETE"
    echo "════════════════════════════════════════"
    echo "  Branch:  $BRANCH"
    echo "  Worktree: $WORKTREE_PATH"
    echo "  PR:       ${event.payload.stdout}"
    echo "════════════════════════════════════════"
