# yaml-language-server: $schema=.handl/generated/schemas/nodes/reproduce.schema.json
# reproduce: install deps and run baseline checks in the worktree.
# Reusable by any workflow that needs a baseline before making changes.
#
# Expects env:
#   BUG_TEST_PATH — test file/path to run (optional; defaults to vp check)
#
# Emits: reproduce.done | <workflow>.aborted

id: reproduce
driver: shell
on: [worktree.ready]
emits: [reproduce.done, bugfix.aborted]
params:
  cmd: |
    source /tmp/handl-bugfix-env
    cd "$WORKTREE_PATH"
    bun install
    if [ -n "$BUG_TEST_PATH" ]; then
      echo "Running targeted tests: $BUG_TEST_PATH"
      vp test "$BUG_TEST_PATH" 2>&1 || true
    else
      echo "No BUG_TEST_PATH set — running vp check for baseline"
      vp check 2>&1 || true
    fi
  emit:
    0: reproduce.done
    default: bugfix.aborted
  timeout: 600
