# yaml-language-server: $schema=.handl/generated/schemas/nodes/review.schema.json
# review: spawn a normal-mode agent to review the diff.
# Reusable by any workflow that needs agent review before PR.
#
# Expects env:
#   BUG_DESCRIPTION — context for the reviewer
#
# Emits: review.done | <workflow>.aborted

id: review
driver: shell
on: [commit.done]
emits: [review.done, bugfix.aborted]
params:
  cmd: |
    source /tmp/handl-bugfix-env
    cd "$WORKTREE_PATH"

    DIFF=$(git diff HEAD~1 HEAD)
    FILES=$(git diff --name-only HEAD~1 HEAD)

    devin -p "You are reviewing a bugfix for ndocs-3 (Effect + Bun + Vite+).
    Bug: $BUG_DESCRIPTION

    Changed files:
    $FILES

    Full diff:
    $DIFF

    Review for:
    1. CORRECTNESS: Does the fix address the root cause?
    2. CONVENTIONS: English identifiers, Effect patterns, portability (no cloud SDKs in src/core/)
    3. TESTS: Are there tests covering the fix?
    4. SURGICAL: Are changes minimal — no unrelated refactoring?
    5. SECURITY: No secrets logged, no injection risks?

    Output:
    VERDICT: APPROVE | REQUEST_CHANGES | BLOCK
    ISSUES: <list of issues, or 'none'>
    SUGGESTIONS: <list, or 'none'>" \
      --respect-workspace-trust false \
      --permission-mode normal
  emit:
    0: review.done
    default: bugfix.aborted
  timeout: 300
