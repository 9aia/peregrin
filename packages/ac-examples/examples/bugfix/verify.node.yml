# yaml-language-server: $schema=.ac/generated/schemas/nodes/verify.schema.json
# verify: run vp check + targeted tests in the worktree.
# Reusable by any workflow that needs to validate changes.
#
# Expects env:
#   BUG_TEST_PATH — test file/path to run (optional)
#
# Emits: verify.passed | verify.failed
# Writes output to /tmp/ac-bugfix-verify-output.txt for retry feedback.

id: verify
driver: shell
on: [fix.done]
emits: [verify.passed, verify.failed]
params:
  cmd: |
    source /tmp/ac-bugfix-env
    cd "$WORKTREE_PATH"

    echo "Running vp check (light tier)..."
    vp check 2>&1 | tee /tmp/ac-bugfix-verify-output.txt
    CHECK_RC=$?

    if [ $CHECK_RC -ne 0 ]; then
      echo "vp check failed (rc=$CHECK_RC)"
      exit 1
    fi

    if [ -n "$BUG_TEST_PATH" ]; then
      echo "Running targeted tests: $BUG_TEST_PATH"
      vp test "$BUG_TEST_PATH" 2>&1 | tee -a /tmp/ac-bugfix-verify-output.txt
      TEST_RC=$?
      if [ $TEST_RC -ne 0 ]; then
        echo "tests failed (rc=$TEST_RC)"
        exit 1
      fi
    fi

    echo "all checks passed"
  timeout: 600
