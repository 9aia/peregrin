# capability-confinement: a worked example of "AI confines AI"
#
# This workflow demonstrates the keystone safety claim of agent-campaign:
# even if an AI generates something dangerous, the workflow's capability
# boundary catches it at dispatch time — before the driver runs.
#
# The loop:
#   1. generate  — AI creates shell nodes with broad self-attested caps
#   2. review    — AI strips self-attested caps (capability reduction)
#   3. inject    — runner injects the reviewed nodes into the live graph
#   4. enforce   — workflow caps block the dangerous node, allow the safe one
#
# The workflow caps (shell.allow: ["echo *"]) are the immutable boundary.
# The AI cannot widen them — it can only narrow. The dangerous node
# (rm -rf) is blocked; the safe node (echo) runs. A capability.violation
# event is emitted with the violation details.
#
# Run:  ac run examples/capability-confinement/main.yaml

name: capability-confinement

import:
  - file: handlers.py
    as: conf

# --- the workflow's capability boundary (the "constitution") ---
# These caps apply to ALL nodes, including injected ones. Deny-all by
# default: nothing is allowed unless explicitly in an allow list.
capabilities:
  default_policy: deny
  shell:
    allow: ["echo *"]
  python:
    allow: ["conf:*"]

events:
  - type: generate.done
    fields: { nodes: array }
  - type: review.done
    fields: { nodes: array }
  - type: inject.done
    fields: { injected: integer }
  - type: safe-op.done
    fields: { stdout: string, rc: integer }
  - type: dangerous-op.done
    fields: { stdout: string, rc: integer }
  - type: capability.violation
    fields: { node: string, violations: array }
  - type: confinement.demonstrated
    fields: { stdout: string, rc: integer }
  - type: confinement.failed
    fields: { stdout: string, rc: integer }

nodes:
  # --- generator: AI creates nodes with broad self-attested capabilities ---
  - id: generate
    driver: python
    handler: conf:generate
    on: [start]
    emits: [generate.done]

  # --- reviewer: AI strips self-attested caps (capability reduction) ---
  - id: review
    driver: python
    handler: conf:review
    on: [generate.done]
    emits: [review.done]

  # --- inject: runner injects reviewed nodes into the live graph ---
  - id: inject
    driver: runner
    on: [review.done]
    emits: [inject.done]

  # --- report: the dangerous node was caught (subscribes to the violation) ---
  - id: report
    driver: shell
    on: [capability.violation]
    emits: [confinement.demonstrated]
    with:
      cmd: |
        echo "=== CAPABILITY CONFINEMENT DEMONSTRATED ==="
        echo "Blocked node:  ${event.payload.node}"
        echo "Violations:    ${event.payload.violations}"
        echo ""
        echo "The workflow caps (shell.allow: ['echo *']) caught the"
        echo "dangerous node at dispatch time, before it could execute."
        echo "The safe node (echo hello) was allowed to run."

  # --- safety net: if the dangerous node was NOT blocked, something is wrong ---
  - id: alert-breach
    driver: shell
    on: [dangerous-op.done]
    emits: [confinement.failed]
    with:
      cmd: |
        echo "ERROR: dangerous-op was NOT blocked!"
        echo "Capability enforcement failed — the workflow caps did not catch it."
        echo "This should never happen. Check the workflow capabilities."
