# campaign/merge-gate: human-in-the-loop merge confirmation gate.
# Reusable — any workflow that pauses for human merge confirmation between waves.
#
# on:    gate.merge.run
# emits: gate.merge.ok | gate.merge.rejected
#
# with:
#   prompt  — the message shown to the human (default: instructs to type "merged")
#   expect  — the exact response that means "proceed" (default: "merged")
#   timeout — seconds to wait (default: 0 = no limit)
#
# Replaces the `read -r RESPONSE` shell pattern in auth-migration's
# wave-wait-merge nodes. The human's answer is in the event payload for audit.

id: campaign.merge-gate
driver: human
on: [gate.merge.run]
emits: [gate.merge.ok, gate.merge.rejected]
params:
  prompt: |
    ========================================
      PRs created. Merge them to main.
      Then type 'merged' and press Enter.
    ========================================
  expect: "merged"
