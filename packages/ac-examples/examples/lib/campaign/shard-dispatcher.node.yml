# campaign/shard-dispatcher: fan out start events for parallel shard pipelines.
# Reusable — any workflow that runs N independent shard pipelines (e.g. plugins).
#
# on:    start
# emits: shard.**.start
#
# Config:
#   shards: list of {id, ...} dicts. One start event per shard is emitted.
#
# Each shard pipeline subscribes to shard.<id>.start and emits shard.<id>.done.
# The ${event.shard} placeholder gives downstream nodes the shard id without
# event.type.split('.')[1] hacks.
#
# Usage in a workflow:
#   - snippet: campaign.shard-dispatcher
#     with:
#       shard_event: plugin.start   # override the event prefix
#
# Or copy this node and customize the handler.

id: campaign.shard-dispatcher
driver: python
handler: agent_campaign.handlers:dispatch_shards
on: [start]
emits: [shard.**.start]
max_fires: unlimited
