# campaign/wave-fanin: declarative fan-in for parallel PR waves.
# Reusable — any workflow that fans out N PRs and waits for all to finish.
#
# on:    pr.finished
# emits: wave.done
# fan_in: {count_from: <config.path>, emit: wave.done}
#
# Config:
#   The count_from path points to a list in config whose length is the
#   expected number of pr.finished events. For example:
#
#   config:
#     wave1:
#       prs: [pr1, pr2]    # count_from: wave1.prs → waits for 2
#
# Replaces the per-wave wave_fanin Python handler in auth-migration.
# No driver, no handler — pure declarative fan-in.

id: campaign.wave-fanin
on: [pr.finished]
emits: [wave.done]
fan_in:
  count_from: wave.prs
  emit: wave.done
