# git/commit: stage and commit with a conventional message.
# Reusable — any workflow that needs to commit work.
#
# on:    git.commit.run
# emits: git.commit.done | git.commit.failed
#
# Reads from state:
#   worktree_path — the worktree to commit in (set by git.worktree)
#   branch        — the branch name (for the commit message)
#
# Reads from state (optional):
#   commit_summary — multi-line summary for the commit body
#                    (falls back to ${state.commit_message} or BUG_DESCRIPTION)

id: git.commit
driver: shell
on: [git.commit.run]
emits: [git.commit.done, git.commit.failed]
params:
  cmd: |
    cd "${state.worktree_path}"
    SUMMARY="${state.commit_summary:-${state.commit_message:-${BUG_DESCRIPTION:-changes}}}"
    git add -A
    git commit -m "${COMMIT_SUBJECT:-fix: ${BUG_DESCRIPTION:-${state.branch}}}" -m "$SUMMARY"
  emit:
    0: git.commit.done
    default: git.commit.failed
