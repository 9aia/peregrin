# git/push: push current branch to origin.
# Reusable — any workflow that needs to push.
#
# on:    git.push.run
# emits: git.push.done | git.push.failed
#
# Reads from state:
#   worktree_path — the worktree to push from (set by git.worktree)
#   branch        — the branch to push

id: git.push
driver: shell
on: [git.push.run]
emits: [git.push.done, git.push.failed]
params:
  cmd: |
    cd "${state.worktree_path}"
    git push -u origin "${state.branch}"
  emit:
    0: git.push.done
    default: git.push.failed
