# yaml-language-server: $schema=.handl/schema.gen.json
# minimal-compose/ — explicit composition with include: and snippet:.
#
# No .handl/ directory — everything is declared explicitly. Run with:
#
#   handl run examples/minimal-compose/main.yaml --dry-run

name: minimal-compose

# include: merges events.yaml into this dict (dict-level)
include: [events.yaml]

# Named snippets — define once, use by name anywhere
snippets:
  shell-base:
    driver: shell
    params:
      timeout: 30

  devin:
    snippet: shell-base # snippet inheritance
    params:
      cmd: "devin run"

  # Scalar snippet — injected via ${snippet(name)} at any value position
  model: sonnet

nodes:
  # snippet: merges the named snippet into this node
  - id: lint
    snippet: shell-base
    on: [start]
    emits: [lint.done]
    params:
      cmd: "ruff check ." # local overrides snippet

  # snippet with inheritance — gets cmd + model + timeout from "devin"
  - id: review
    snippet: devin
    on: [lint.done]
    emits: [review.done]

  # ${snippet(name)} injects at value level (string interpolation)
  - id: deploy
    driver: shell
    on: [review.done]
    emits: [deploy.done]
    params:
      cmd: "deploy --model=${snippet(model)}"
