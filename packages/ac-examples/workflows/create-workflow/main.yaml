# create-workflow: a meta-workflow that generates, validates, dry-runs, and
# reviews agent-campaign workflows. This is the framework's meta-loop:
# generate → validate → dry-run → review → (fix if rejected) → done.
#
# The generator agent reads a spec file + framework docs/examples and writes
# a workflow YAML + prompt files. The reviewer agent checks the dry-run
# output and the YAML for correctness. The fix agent iterates on feedback.
#
# Why three layers of checking:
#   - handl validate  → structural (orphan subscriptions — warn-only, no exit-1)
#   - handl --dry-run → runtime (node failures, prompt path errors, event flow)
#   - agent review → semantic (fan-in without driver, event collisions,
#                    parallel agents editing same files — issues neither
#                    tool catches, learned from real experience)
#
# Usage:
#   SPEC_PATH=/path/to/spec.md \
#   WORKFLOW_PATH=campaigns/my-campaign/main.yaml \
#   WORKFLOW_NAME=my-campaign \
#   handl run workflows/create-workflow/main.yaml
#
# Inputs:
#   SPEC_PATH     — markdown file describing what the campaign should do
#   WORKFLOW_PATH — where to write the generated main.yaml (relative to
#                   the repo root, or absolute)
#   WORKFLOW_NAME — the `name:` field in the generated YAML
#
# The generator prompt (generate.prompt.md) encodes 11 gotcha rules from
# real experience so the generator avoids common mistakes upfront. The
# reviewer prompt (review.prompt.md) has a 26-item checklist covering
# structural, runtime, and semantic correctness.

name: create-workflow

config:
  # Portable defaults — override via AC_PUBLIC_* env vars:
  #   AC_PUBLIC_REPO=/path/to/repo  AC_PUBLIC_AGENT_RUNNER=claude-code
  repo: .
  agent_runner: devin
  max_fix_attempts: 3

events:
  - type: start
  - type: generate.done
    fields: { stdout: string }
  - type: generate.failed
    fields: { stderr: string }
  - type: validate.passed
    fields: { stdout: string }
  - type: validate.failed
    fields: { stdout: string }
  - type: dryrun.done
    fields: { stdout: string }
  - type: dryrun.failed
    fields: { stdout: string }
  - type: review.approved
    fields: { stdout: string }
  - type: review.rejected
    fields: { stdout: string }
  - type: fix.done
    fields: { stdout: string }
  - type: fix.failed
    fields: { stderr: string }
  - type: node.exhausted
    fields: { node: string, max_fires: integer }
  - type: create-workflow.complete
  - type: create-workflow.aborted
    fields: { reason: string }

nodes:
  # ─── Generate ────────────────────────────────────────────────────────────
  # Agent reads the spec file + framework docs/examples, then writes the
  # workflow YAML + prompt files + copies lib nodes to .handl/lib/.
  # The prompt encodes 11 gotcha rules so the generator avoids common
  # mistakes (fan-in without driver, event collisions, etc.) upfront.
  - id: generate
    driver: agent
    on: [start]
    emits: [generate.done, generate.failed]
    params:
      runner: "${config.agent_runner}"
      prompt_file: workflows/create-workflow/generate.prompt.md
      permission_mode: dangerous
      trust: false
      timeout: 900
      cwd: "${config.repo}"
      emit:
        0: generate.done
        default: generate.failed

  # ─── Validate ───────────────────────────────────────────────────────────
  # Structural check: handl validate warns about orphan subscriptions (warn-only,
  # no exit-1). Also fires after fix.done — re-validates after each fix.
  - id: validate
    driver: shell
    on: [generate.done, fix.done]
    emits: [validate.passed, validate.failed]
    params:
      cmd: |
        cd "${config.repo}"
        handl validate "${WORKFLOW_PATH}" 2>&1
      emit:
        0: validate.passed
        default: validate.failed
      timeout: 30

  # ─── Dry-run ────────────────────────────────────────────────────────────
  # Runtime check: handl run --dry-run simulates the full event flow without
  # side effects. Catches node failures, prompt_file path errors, and
  # verifies all nodes fire and the event sequence is correct.
  - id: dryrun
    driver: shell
    on: [validate.passed]
    emits: [dryrun.done, dryrun.failed]
    params:
      cmd: |
        cd "${config.repo}"
        handl run "${WORKFLOW_PATH}" --dry-run --no-store 2>&1
      emit:
        0: dryrun.done
        default: dryrun.failed
      timeout: 60

  # ─── Review ─────────────────────────────────────────────────────────────
  # Semantic check: a normal-mode agent reviews the dry-run output + YAML
  # against a 26-item checklist. Catches issues neither handl validate nor
  # dry-run can detect: fan-in nodes without a driver, event collisions
  # on repeated steps, parallel agents editing the same files, state
  # variables read before being set, unhandled node.exhausted, etc.
  - id: review
    driver: agent
    on: [dryrun.done]
    emits: [review.approved, review.rejected]
    params:
      runner: "${config.agent_runner}"
      prompt_file: workflows/create-workflow/review.prompt.md
      permission_mode: normal
      trust: false
      timeout: 300
      cwd: "${config.repo}"
      env:
        DRYRUN_OUTPUT: "${event.payload.stdout}"
      emit:
        0: review.approved
        default: review.rejected

  # ─── Fix (retry loop) ───────────────────────────────────────────────────
  # Agent fixes issues from validate/dry-run/review feedback. Loops back
  # to validate after each fix. Bounded by max_fires: 3 — if the workflow
  # still fails after 3 fix attempts, the bus emits node.exhausted, which
  # the fix-exhausted node catches to abort with manual debugging instructions.
  - id: fix
    driver: agent
    on: [validate.failed, review.rejected]
    emits: [fix.done, fix.failed]
    max_fires: 3
    params:
      runner: "${config.agent_runner}"
      prompt_file: workflows/create-workflow/fix.prompt.md
      permission_mode: dangerous
      trust: false
      timeout: 600
      cwd: "${config.repo}"
      emit:
        0: fix.done
        default: fix.failed

  # ─── Report ─────────────────────────────────────────────────────────────
  # Success: workflow passed all three checks (validate, dry-run, review).
  - id: report
    driver: shell
    on: [review.approved]
    emits: [create-workflow.complete]
    params:
      cmd: |
        echo ""
        echo "========================================"
        echo "  WORKFLOW READY: ${WORKFLOW_PATH}"
        echo "========================================"
        echo "  Validated, dry-run passed, review approved."
        echo "  Run with:"
        echo "    handl run ${WORKFLOW_PATH}"
        echo "========================================"

  # ─── Abort ──────────────────────────────────────────────────────────────
  # Hard failure: generation crashed, dry-run failed, or the fix agent
  # itself crashed (not just "review rejected" — that's the retry path).
  - id: abort
    driver: shell
    on: [generate.failed, dryrun.failed, fix.failed]
    emits: [create-workflow.aborted]
    params:
      cmd: |
        echo ""
        echo "========================================"
        echo "  WORKFLOW CREATION FAILED"
        echo "========================================"
        echo "  Reason: ${event.payload.stderr}"
        echo "========================================"

  # ─── Fix exhausted ──────────────────────────────────────────────────────
  # Soft failure: 3 fix attempts without approval (the bus emitted
  # node.exhausted when fix hit max_fires and another review.rejected or
  # validate.failed arrived). The workflow may be mostly correct — print
  # manual debugging commands so the human can finish it.
  - id: fix-exhausted
    driver: shell
    on: [node.exhausted]
    emits: [create-workflow.aborted]
    params:
      cmd: |
        echo ""
        echo "========================================"
        echo "  FIX EXHAUSTED — ${config.max_fix_attempts} attempts"
        echo "  Node '${event.payload.node}' hit max_fires=${event.payload.max_fires}"
        echo "  Review the workflow manually:"
        echo "    handl validate ${WORKFLOW_PATH}"
        echo "    handl run ${WORKFLOW_PATH} --dry-run"
        echo "========================================"
