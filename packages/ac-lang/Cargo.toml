[package]
name = "ac-lang"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/dialect",
  "crates/ast",
  "crates/runtime",
  "crates/vm",
  "crates/frontend-json",
  "crates/frontend-yaml",
  "crates/frontend-toml",
  "crates/schema",
  "crates/schema-json",
  "crates/source",
  "crates/fields",
  "crates/typegen-core",
  "crates/typegen-key-merge",
  "crates/typegen-key-inherit",
  "crates/typegen-key-mutable",
  "crates/typegen-key-expr",
  "crates/typegen-key-arg",
  "crates/resolver-core",
  "crates/resolver-file",
  "crates/resolver-virtual",
  "crates/resolver-http",
  "crates/resolver-git",
  "crates/typegen-import",
  "crates/typegen-backend-json-schema",
  "crates/typecheck-core",
  "crates/typecheck-infer",
  "crates/typecheck-key-expr",
  "crates/typecheck-key-arg",
  "crates/typecheck-key-merge",
  "crates/typecheck-key-inherit",
  "crates/typecheck-key-mutable",
  "crates/typecheck-import",
  "crates/typecheck-schema-json",
  "crates/frontend",
  "crates/host",
  "crates/engine-core",
  "crates/engine-pass-parse",
  "crates/engine-pass-extract",
  "crates/engine-pass-resolve",
  "crates/engine-pass-typecheck",
  "crates/engine-pass-generate",
  "crates/engine",
  "crates/engine-tests",
  "crates/bench",
  "crates/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ac-dialect = { path = "crates/dialect" }
ac-ast = { path = "crates/ast" }
ac-runtime = { path = "crates/runtime" }
ac-vm = { path = "crates/vm" }
ac-frontend-json = { path = "crates/frontend-json" }
ac-frontend-yaml = { path = "crates/frontend-yaml" }
ac-frontend-toml = { path = "crates/frontend-toml" }
ac-schema = { path = "crates/schema" }
ac-schema-json = { path = "crates/schema-json" }
ac-source = { path = "crates/source" }
ac-fields = { path = "crates/fields" }
ac-cli = { path = "crates/cli" }
ac-frontend = { path = "crates/frontend" }
ac-host = { path = "crates/host" }
ac-engine-core = { path = "crates/engine-core" }
ac-engine-pass-parse = { path = "crates/engine-pass-parse" }
ac-engine-pass-extract = { path = "crates/engine-pass-extract" }
ac-engine-pass-resolve = { path = "crates/engine-pass-resolve" }
ac-engine-pass-typecheck = { path = "crates/engine-pass-typecheck" }
ac-engine-pass-generate = { path = "crates/engine-pass-generate" }
ac-engine = { path = "crates/engine" }
ac-engine-tests = { path = "crates/engine-tests" }
ac-typegen-core = { path = "crates/typegen-core" }
ac-typegen-key-merge = { path = "crates/typegen-key-merge" }
ac-typegen-key-inherit = { path = "crates/typegen-key-inherit" }
ac-typegen-key-mutable = { path = "crates/typegen-key-mutable" }
ac-typegen-key-expr = { path = "crates/typegen-key-expr" }
ac-typegen-key-arg = { path = "crates/typegen-key-arg" }
ac-resolver-core = { path = "crates/resolver-core" }
ac-resolver-file = { path = "crates/resolver-file" }
ac-resolver-virtual = { path = "crates/resolver-virtual" }
ac-resolver-http = { path = "crates/resolver-http" }
ac-resolver-git = { path = "crates/resolver-git" }
ac-typegen-import = { path = "crates/typegen-import" }
ac-typegen-backend-json-schema = { path = "crates/typegen-backend-json-schema" }
ac-typecheck-core = { path = "crates/typecheck-core" }
ac-typecheck-infer = { path = "crates/typecheck-infer" }
ac-typecheck-key-expr = { path = "crates/typecheck-key-expr" }
ac-typecheck-key-arg = { path = "crates/typecheck-key-arg" }
ac-typecheck-key-merge = { path = "crates/typecheck-key-merge" }
ac-typecheck-key-inherit = { path = "crates/typecheck-key-inherit" }
ac-typecheck-key-mutable = { path = "crates/typecheck-key-mutable" }
ac-typecheck-import = { path = "crates/typecheck-import" }
ac-typecheck-schema-json = { path = "crates/typecheck-schema-json" }
hex = "0.4"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"

[dependencies]
ac-ast.workspace = true
ac-runtime.workspace = true
ac-vm.workspace = true
ac-frontend-json.workspace = true
ac-frontend-yaml.workspace = true
ac-frontend-toml.workspace = true
ac-schema.workspace = true
ac-schema-json.workspace = true
ac-fields.workspace = true
ac-source.workspace = true
ac-host.workspace = true
ac-engine.workspace = true
ac-engine-core.workspace = true
ac-resolver-core.workspace = true
ac-resolver-file.workspace = true
ac-resolver-virtual.workspace = true
ac-typecheck-core.workspace = true
ac-typecheck-schema-json.workspace = true
ac-typegen-core.workspace = true
ac-typegen-backend-json-schema.workspace = true

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[[example]]
name = "basic"
path = "examples/basic/main.rs"

[[example]]
name = "functions"
path = "examples/functions/main.rs"

[[example]]
name = "fields"
path = "examples/fields/main.rs"
