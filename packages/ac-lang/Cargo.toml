[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[[example]]
name = "basic"
path = "examples/basic/main.rs"

[[example]]
name = "functions"
path = "examples/functions/main.rs"

[[example]]
name = "fields"
path = "examples/fields/main.rs"

[[example]]
name = "handlers"
path = "examples/handlers/main.rs"

[[example]]
name = "resumable"
path = "examples/resumable/main.rs"

[[example]]
name = "content-addressing"
path = "examples/content-addressing/main.rs"

[[example]]
name = "multi-handler"
path = "examples/multi-handler/main.rs"

[[example]]
