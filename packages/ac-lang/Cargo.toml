[package]
name = "ac-lang"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "crates/dialect",
  "crates/dialect-canonical",
  "crates/ast",
  "crates/ast-canonical",
  "crates/ast-common",
  "crates/runtime",
  "crates/runtime-config",
  "crates/runtime-core",
  "crates/lib-utils",
  "crates/lib-utils/bytes",
  "crates/lib-unicode",
  "crates/lib-collections",
  "crates/lib-datetime",
  "crates/lib-intl",
  "crates/rust-lib-ecma402-traits",
  "crates/rust-lib-ecma402-icu4x",
  "crates/rust-lib-icu4x-extra",
  "crates/lib-crypto",
  "crates/lib-rand",
  "crates/lib-test",
  "crates/lib-kv",
  "crates/lib-kv-hashmap",
  "crates/lib-os",
  "crates/lib-os-std",
  "crates/lib-http-client",
  "crates/lib-http-client-std",
  "crates/lib-http-server",
  "crates/lib-http-server-std",
  "crates/vm",
  "crates/vm-common",
  "crates/vm-canonical",
  "crates/frontend-json",
  "crates/frontend-yaml",
  "crates/frontend-toml",
  "crates/source",
  "crates/fields",
  "crates/typegen-core",
  "crates/typegen-key-set-special",
  "crates/module-resolver-core",
  "crates/module-resolver-memory",
  "crates/module-resolver-noop",
  "crates/module-resolver-file",
  "crates/module-resolver-virtual",
  "crates/module-resolver-http",
  "crates/module-resolver-git",
  "crates/typegen-import",
  "crates/typegen-backend-json-schema",
  "crates/typecheck-core",
  "crates/typecheck-infer",
  "crates/typecheck-key-expr",
  "crates/typecheck-key-arg",
  "crates/typecheck-key-merge",
  "crates/typecheck-key-inherit",
  "crates/typecheck-key-mutable",
  "crates/typecheck-key-termination",
  "crates/typecheck-import",
  "crates/typecheck-schema-json",
  "crates/frontend",
  "crates/host",
  "crates/compiler-common",
  "crates/compiler-canonical",
  "crates/compiler-pass-parse",
  "crates/compiler-pass-extract",
  "crates/compiler-pass-resolve",
  "crates/compiler-pass-typecheck",
  "crates/compiler-pass-generate",
  "crates/compiler",
  "crates/compiler-backend-js",
  "crates/compiler-tests",
  "crates/bench",
  "crates/cli",
  "crates/experiment-host-sugar",
  "crates/meta",
  "crates/store",
  "crates/codebase",
  "crates/integration-tests",
  "crates/runtime-type",
  "crates/runtime-sandbox",
  "crates/runtime-server",
  "crates/lexer",
  "crates/lexer-canonical",
  "crates/lexer-common",
  "crates/parser",
  "crates/parser-canonical",
  "crates/parser-common",
  "crates/lib-compress",
  "crates/lib-compress-gzip",
  "crates/lib-archive",
  "crates/lib-archive-tar",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ac-dialect = { path = "crates/dialect" }
ac-dialect-canonical = { path = "crates/dialect-canonical" }
ac-ast = { path = "crates/ast" }
ac-ast-canonical = { path = "crates/ast-canonical" }
ac-ast-common = { path = "crates/ast-common" }
ac-runtime-values = { path = "crates/runtime" }
ac-runtime-config = { path = "crates/runtime-config" }
ac-runtime-modules = { path = "crates/runtime-core" }
ac-lib-utils = { path = "crates/lib-utils" }
ac-lib-utils-bytes = { path = "crates/lib-utils/bytes" }
ac-lib-unicode = { path = "crates/lib-unicode" }
ac-lib-collections = { path = "crates/lib-collections" }
ac-lib-datetime = { path = "crates/lib-datetime" }
ac-lib-intl = { path = "crates/lib-intl" }
ecma402-traits = { package = "rust-lib-ecma402-traits", path = "crates/rust-lib-ecma402-traits" }
ecma402-icu4x = { package = "rust-lib-ecma402-icu4x", path = "crates/rust-lib-ecma402-icu4x" }
icu4x-extra = { package = "rust-lib-icu4x-extra", path = "crates/rust-lib-icu4x-extra" }
ac-lib-crypto = { path = "crates/lib-crypto" }
ac-lib-rand = { path = "crates/lib-rand" }
ac-lib-test = { path = "crates/lib-test" }
ac-lib-kv = { path = "crates/lib-kv" }
ac-lib-kv-hashmap = { path = "crates/lib-kv-hashmap" }
ac-lib-os = { path = "crates/lib-os" }
ac-lib-os-std = { path = "crates/lib-os-std" }
ac-lib-http-client = { path = "crates/lib-http-client" }
ac-lib-http-client-std = { path = "crates/lib-http-client-std" }
ac-lib-http-server = { path = "crates/lib-http-server" }
ac-lib-http-server-std = { path = "crates/lib-http-server-std" }
ac-lib-compress = { path = "crates/lib-compress" }
ac-lib-compress-gzip = { path = "crates/lib-compress-gzip" }
ac-lib-archive = { path = "crates/lib-archive" }
ac-lib-archive-tar = { path = "crates/lib-archive-tar" }
ac-runtime = { path = "crates/vm" }
ac-runtime-common = { path = "crates/vm-common" }
ac-runtime-canonical = { path = "crates/vm-canonical" }
ac-frontend-json = { path = "crates/frontend-json" }
ac-frontend-yaml = { path = "crates/frontend-yaml" }
ac-frontend-toml = { path = "crates/frontend-toml" }
ac-source = { path = "crates/source" }
ac-fields = { path = "crates/fields" }
ac-cli = { path = "crates/cli" }
ac-frontend = { path = "crates/frontend" }
ac-runtime-example-1 = { path = "crates/host" }
ac-compiler-common = { path = "crates/compiler-common" }
ac-compiler-canonical = { path = "crates/compiler-canonical" }
ac-compiler-backend-js = { path = "crates/compiler-backend-js" }
ac-compiler-pass-parse = { path = "crates/compiler-pass-parse" }
ac-compiler-pass-extract = { path = "crates/compiler-pass-extract" }
ac-compiler-pass-resolve = { path = "crates/compiler-pass-resolve" }
ac-compiler-pass-typecheck = { path = "crates/compiler-pass-typecheck" }
ac-compiler-pass-generate = { path = "crates/compiler-pass-generate" }
ac-compiler = { path = "crates/compiler" }
ac-compiler-tests = { path = "crates/compiler-tests" }
ac-typegen-core = { path = "crates/typegen-core" }
ac-typegen-key-set-special = { path = "crates/typegen-key-set-special" }
ac-module-resolver-core = { path = "crates/module-resolver-core" }
ac-module-resolver-memory = { path = "crates/module-resolver-memory" }
ac-module-resolver-noop = { path = "crates/module-resolver-noop" }
ac-module-resolver-file = { path = "crates/module-resolver-file" }
ac-module-resolver-virtual = { path = "crates/module-resolver-virtual" }
ac-module-resolver-http = { path = "crates/module-resolver-http" }
ac-module-resolver-git = { path = "crates/module-resolver-git" }
ac-typegen-import = { path = "crates/typegen-import" }
ac-typegen-backend-json-schema = { path = "crates/typegen-backend-json-schema" }
ac-typecheck-core = { path = "crates/typecheck-core" }
ac-typecheck-infer = { path = "crates/typecheck-infer" }
ac-typecheck-key-expr = { path = "crates/typecheck-key-expr" }
ac-typecheck-key-arg = { path = "crates/typecheck-key-arg" }
ac-typecheck-key-merge = { path = "crates/typecheck-key-merge" }
ac-typecheck-key-inherit = { path = "crates/typecheck-key-inherit" }
ac-typecheck-key-mutable = { path = "crates/typecheck-key-mutable" }
ac-typecheck-key-termination = { path = "crates/typecheck-key-termination" }
ac-typecheck-import = { path = "crates/typecheck-import" }
ac-typecheck-schema-json = { path = "crates/typecheck-schema-json" }
ac-meta = { path = "crates/meta" }
ac-store = { path = "crates/store" }
ac-codebase = { path = "crates/codebase" }
ac-integration-tests = { path = "crates/integration-tests" }
ac-runtime-type = { path = "crates/runtime-type" }
ac-runtime-sandbox = { path = "crates/runtime-sandbox" }
ac-runtime-server = { path = "crates/runtime-server" }
ac-lexer = { path = "crates/lexer" }
ac-lexer-canonical = { path = "crates/lexer-canonical" }
ac-lexer-common = { path = "crates/lexer-common" }
ac-parser = { path = "crates/parser" }
ac-parser-canonical = { path = "crates/parser-canonical" }
ac-parser-common = { path = "crates/parser-common" }
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
pass-lang = "1"
driver-lang = "1"

[features]
default = [
  "vm",
  "host",
  "json",
  "yaml",
  "toml",
  "fields",
  "dialect-canonical",
  "compiler",
  "typecheck",
  "typegen",
  "resolver-core",
  "resolver-memory",
  "resolver-noop",
  "resolver-file",
  "resolver-virtual",
  "lib-utils",
  "lib-datetime",
  "lib-intl",
  "lib-crypto",
  "lib-rand",
  "lib-test",
  "lib-kv",
  "lib-kv-hashmap",
  "lib-os",
  "lib-os-std",
  "lib-http-client",
  "lib-http-client-std",
  "lib-http-server",
  "lib-http-server-std",
  "lib-unicode",
  "store",
  "codebase",
]

vm = ["ac-runtime", "ac-runtime-canonical"]
host = ["dep:ac-runtime-example-1", "vm"]
json = ["dep:ac-frontend-json"]
yaml = ["dep:ac-frontend-yaml"]
toml = ["dep:ac-frontend-toml"]
fields = ["dep:ac-fields"]
dialect-canonical = ["dep:ac-dialect-canonical"]
compiler = [
  "dep:ac-compiler",
  "dep:ac-compiler-canonical",
  "vm",
  "host",
  "fields",
  "dialect-canonical",
  "typecheck",
  "typegen",
  "resolver-core",
  "resolver-memory",
  "resolver-file",
]
typecheck = ["dep:ac-typecheck-core", "dep:ac-typecheck-schema-json"]
typegen = ["dep:ac-typegen-core", "dep:ac-typegen-backend-json-schema"]
resolver-core = ["dep:ac-module-resolver-core"]
resolver-memory = ["dep:ac-module-resolver-memory", "resolver-core"]
resolver-noop = ["dep:ac-module-resolver-noop", "resolver-core"]
resolver-file = ["dep:ac-module-resolver-file", "resolver-core"]
resolver-virtual = ["dep:ac-module-resolver-virtual", "resolver-core"]
lib-utils = ["dep:ac-lib-utils", "vm", "dep:ac-runtime-modules"]
lib-datetime = ["dep:ac-lib-datetime", "vm", "dep:ac-runtime-modules"]
lib-intl = ["dep:ac-lib-intl", "vm", "dep:ac-runtime-modules"]
lib-crypto = ["dep:ac-lib-crypto", "vm", "dep:ac-runtime-modules"]
lib-rand = ["dep:ac-lib-rand", "vm", "dep:ac-runtime-modules"]
lib-test = ["dep:ac-lib-test", "vm", "dep:ac-runtime-modules"]
lib-kv = ["dep:ac-lib-kv", "vm", "dep:ac-runtime-modules"]
lib-kv-hashmap = ["dep:ac-lib-kv-hashmap", "lib-kv"]
lib-os = ["dep:ac-lib-os", "vm", "dep:ac-runtime-modules"]
lib-os-std = ["dep:ac-lib-os-std", "lib-os"]
lib-http-client = ["dep:ac-lib-http-client", "vm", "dep:ac-runtime-modules"]
lib-http-client-std = ["dep:ac-lib-http-client-std", "lib-http-client"]
lib-http-server = ["dep:ac-lib-http-server", "vm", "dep:ac-runtime-modules"]
lib-http-server-std = ["dep:ac-lib-http-server-std", "lib-http-server"]
lib-unicode = ["dep:ac-lib-unicode", "vm", "dep:ac-runtime-modules"]
store = ["dep:ac-store"]
codebase = ["dep:ac-codebase", "store"]

[dependencies]
ac-ast.workspace = true
ac-ast-canonical.workspace = true
ac-dialect.workspace = true
ac-runtime-values.workspace = true
ac-source.workspace = true

ac-dialect-canonical = { workspace = true, optional = true }
ac-runtime-modules = { workspace = true, optional = true }
ac-runtime = { workspace = true, optional = true }
ac-runtime-canonical = { workspace = true, optional = true }
ac-runtime-example-1 = { workspace = true, optional = true }
ac-frontend-json = { workspace = true, optional = true }
ac-frontend-yaml = { workspace = true, optional = true }
ac-frontend-toml = { workspace = true, optional = true }
ac-fields = { workspace = true, optional = true }
ac-compiler = { workspace = true, optional = true }
ac-compiler-canonical = { workspace = true, optional = true }
ac-module-resolver-core = { workspace = true, optional = true }
ac-module-resolver-memory = { workspace = true, optional = true }
ac-module-resolver-noop = { workspace = true, optional = true }
ac-module-resolver-file = { workspace = true, optional = true }
ac-module-resolver-virtual = { workspace = true, optional = true }
ac-typecheck-core = { workspace = true, optional = true }
ac-typecheck-schema-json = { workspace = true, optional = true }
ac-typegen-core = { workspace = true, optional = true }
ac-typegen-backend-json-schema = { workspace = true, optional = true }
ac-lib-utils = { workspace = true, optional = true }
ac-lib-datetime = { workspace = true, optional = true }
ac-lib-intl = { workspace = true, optional = true }
ac-lib-crypto = { workspace = true, optional = true }
ac-lib-rand = { workspace = true, optional = true }
ac-lib-test = { workspace = true, optional = true }
