[package]
name = "ac-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
ac-engine-core.workspace = true
ac-dialect.workspace = true
ac-dialect-canonical.workspace = true
ac-engine.workspace = true
ac-engine-pass-parse.workspace = true
ac-engine-pass-extract.workspace = true
ac-engine-pass-typecheck.workspace = true
ac-frontend.workspace = true
ac-resolver-virtual.workspace = true
ac-typecheck-core.workspace = true
ac-typecheck-infer.workspace = true
ac-typecheck-key-expr.workspace = true
ac-typecheck-key-arg.workspace = true
ac-typecheck-key-merge.workspace = true
ac-typecheck-key-inherit.workspace = true
ac-typecheck-key-mutable.workspace = true
ac-typecheck-schema-json.workspace = true
ac-fields.workspace = true
ac-runtime.workspace = true
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "plotters",
  "cargo_bench_support",
] }

[lib]
bench = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "typecheck"
harness = false

[[bench]]
name = "infer"
harness = false

[[bench]]
name = "core"
harness = false
