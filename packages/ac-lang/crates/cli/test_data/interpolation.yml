fields:
  name:
    type: string
  version:
    type: number
  greeting:
    type: string
  full_name:
    type: string
  home_dir:
    type: string
  doubled:
    type: number
  sum:
    type: number
  quadrupled:
    type: number
  permission_mode:
    type: string
    inheritable: true
  config:
    type: object
  server:
    type: object
functions:
  add:
    params:
      x: { type: number }
      y: { type: number }
    return: { type: number }
  mul:
    params:
      x: { type: number }
      y: { type: number }
    return: { type: number }
  double:
    params:
      x: { type: number }
    return: { type: number }
    body: "mul(x, 2)"
  quadruple:
    params:
      x: { type: number }
    return: { type: number }
    body: "double(double(x))"
name: alice
version: 1
greeting: "hello, ${doc.name}!"
full_name: "${doc.name} v${doc.version}"
home_dir: "${env.HOME}"
doubled: "${double(version)}"
sum: "${add(add(1, 2), 3)}"
quadrupled: "${quadruple(version)}"
permission_mode: "read-only"
config:
  message: "${permission_mode}"
  server:
    permission_mode: "read-write"
    message: "${permission_mode}"
  deep:
    message: "${permission_mode}"
server:
  message: "${permission_mode}"
