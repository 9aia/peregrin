[package]
name = "crate-ecma402-icu4x"
version.workspace = true
edition.workspace = true

[dependencies]
ecma402-traits = { package = "crate-ecma402-traits", path = "../crate-ecma402-traits" }
icu4x-extra = { package = "crate-icu4x-extra", path = "../crate-icu4x-extra" }
icu = { version = "2", features = ["unstable", "serde"] }
icu_decimal_data = "2"
icu_locale_fallback = { version = "2", features = ["compiled_data"] }
icu_provider = "2"
icu_provider_blob = { version = "2", features = ["alloc"] }
writeable = "0.6"
zerovec = { version = "0.11", features = ["alloc"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
