[package]
name = "ac-lib-http-server-std"
version.workspace = true
edition.workspace = true

[dev-dependencies]
ureq = "2"

[dependencies]
ac-lib-http-server.workspace = true
ac-runtime-canonical.workspace = true
ac-runtime-example-1.workspace = true
ac-runtime-values.workspace = true
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
mime_guess = "2"
matchit = "0.8"
serde_json = "1"
