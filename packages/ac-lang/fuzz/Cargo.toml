[package]
name = "ac-lang-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ac-fields = { path = "../crates/fields" }
ac-typecheck-infer = { path = "../crates/typecheck-infer" }
serde_json = "1"

[[bin]]
name = "expression"
path = "fuzz_targets/expression.rs"

[[bin]]
name = "interpolation"
path = "fuzz_targets/interpolation.rs"

[[bin]]
name = "scoped_interpolation"
path = "fuzz_targets/scoped_interpolation.rs"

[[bin]]
name = "parse_expr"
path = "fuzz_targets/parse_expr.rs"
