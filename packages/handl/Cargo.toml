handl-typecheck-core = { path = "crates/typecheck-core" }
handl-typecheck-infer = { path = "crates/typecheck-infer" }
handl-typecheck-keys = { path = "crates/typecheck-keys" }
handl-typecheck-import = { path = "crates/typecheck-import" }
handl-typecheck-schema-json = { path = "crates/typecheck-schema-json" }
handl-meta = { path = "crates/meta" }
handl-store = { path = "crates/store" }
handl-codebase = { path = "crates/codebase" }
handl-integration-tests = { path = "crates/integration-tests" }
handl-vm-type = { path = "crates/vm-type" }
handl-vm-config = { path = "crates/vm-config" }
handl-vm-server = { path = "crates/vm-server" }
handl-lexer = { path = "crates/lexer" }
handl-lexer-canonical = { path = "crates/lexer-canonical" }
handl-lexer-common = { path = "crates/lexer-common" }
handl-parser = { path = "crates/parser" }
handl-parser-canonical = { path = "crates/parser-canonical" }
handl-parser-common = { path = "crates/parser-common" }
rand = "0.9"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
indexmap = "2"
rayon = "1"
sha2 = "0.10"
thiserror = "2"
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
pass-lang = "1"
driver-lang = "1"

[features]
default = [
  "vm",
  "host",
  "json",
  "yaml",
  "toml",
  "fields",
  "dialect-canonical",
  "compiler",
  "typecheck",
  "typegen",
  "resolver-core",
  "resolver-memory",
  "resolver-noop",
  "resolver-file",
  "resolver-virtual",
  "lib-utils",
  "lib-datetime",
  "lib-intl",
  "lib-crypto",
  "lib-rand",
  "lib-test",
  "lib-kv",
  "lib-kv-hashmap",
  "lib-os",
  "lib-os-std",
  "lib-http-client",
  "lib-http-client-std",
  "lib-http-server",
  "lib-http-server-std",
  "lib-otlp",
  "lib-otlp-std",
  "lib-unicode",
  "lib-ip",
  "store",
  "codebase",
]

vm = ["handl-vm", "handl-vm-backend-rust-interpreter"]
host = ["dep:handl-vm-host-canonical", "vm"]
json = ["dep:handl-frontend-json"]
yaml = ["dep:handl-frontend-yaml"]
toml = ["dep:handl-frontend-toml"]
fields = ["dep:handl-fields"]
dialect-canonical = ["dep:handl-dialect-canonical"]
compiler = [
  "dep:handl-compiler",
  "dep:handl-compiler-canonical",
  "vm",
  "host",
  "fields",
  "dialect-canonical",
  "typecheck",
  "typegen",
  "resolver-core",
  "resolver-memory",
  "resolver-file",
]
typecheck = ["dep:handl-typecheck-core", "dep:handl-typecheck-schema-json"]
typegen = ["dep:handl-typegen-core", "dep:handl-typegen-backend-json-schema"]
resolver-core = ["dep:handl-module-resolver-core"]
resolver-memory = ["dep:handl-module-resolver-memory", "resolver-core"]
resolver-noop = ["dep:handl-module-resolver-noop", "resolver-core"]
resolver-file = ["dep:handl-module-resolver-file", "resolver-core"]
resolver-virtual = ["dep:handl-module-resolver-virtual", "resolver-core"]
lib-utils = ["dep:handl-lib-utils", "vm", "dep:handl-vm-common"]
lib-datetime = ["dep:handl-lib-datetime", "vm", "dep:handl-vm-common"]
lib-intl = ["dep:handl-lib-intl", "vm", "dep:handl-vm-common"]
lib-crypto = ["dep:handl-lib-crypto", "vm", "dep:handl-vm-common"]
lib-rand = ["dep:handl-lib-rand", "vm", "dep:handl-vm-common"]
lib-test = ["dep:handl-lib-test", "vm", "dep:handl-vm-common"]
lib-kv = ["dep:handl-lib-kv", "vm", "dep:handl-vm-common"]
lib-kv-hashmap = ["dep:handl-lib-kv-hashmap", "lib-kv"]
lib-os = ["dep:handl-lib-os", "vm", "dep:handl-vm-common"]
lib-os-std = ["dep:handl-lib-os-std", "lib-os"]
lib-http-client = ["dep:handl-lib-http-client", "vm", "dep:handl-vm-common"]
lib-http-client-std = ["dep:handl-lib-http-client-std", "lib-http-client"]
lib-http-server = ["dep:handl-lib-http-server", "vm", "dep:handl-vm-common"]
lib-http-server-std = ["dep:handl-lib-http-server-std", "lib-http-server"]
lib-otlp = ["dep:handl-lib-otlp", "vm", "dep:handl-vm-common"]
lib-otlp-std = ["dep:handl-lib-otlp-std", "lib-otlp"]
lib-unicode = ["dep:handl-lib-unicode", "vm", "dep:handl-vm-common"]
lib-ip = ["dep:handl-lib-ip"]
store = ["dep:handl-store"]
codebase = ["dep:handl-codebase", "store"]

[dependencies]
handl-ast.workspace = true
handl-ast-canonical.workspace = true
handl-dialect.workspace = true
handl-vm-values-json.workspace = true
handl-source.workspace = true

handl-dialect-canonical = { workspace = true, optional = true }
handl-vm-common = { workspace = true, optional = true }
handl-vm = { workspace = true, optional = true }
handl-vm-backend-rust-interpreter = { workspace = true, optional = true }
handl-vm-host-canonical = { workspace = true, optional = true }
handl-frontend-json = { workspace = true, optional = true }
handl-frontend-yaml = { workspace = true, optional = true }
handl-frontend-toml = { workspace = true, optional = true }
handl-fields = { workspace = true, optional = true }
handl-compiler = { workspace = true, optional = true }
handl-compiler-canonical = { workspace = true, optional = true }
handl-module-resolver-core = { workspace = true, optional = true }
handl-module-resolver-memory = { workspace = true, optional = true }
handl-module-resolver-noop = { workspace = true, optional = true }
handl-module-resolver-file = { workspace = true, optional = true }
handl-module-resolver-virtual = { workspace = true, optional = true }
handl-typecheck-core = { workspace = true, optional = true }
handl-typecheck-schema-json = { workspace = true, optional = true }
handl-typegen-core = { workspace = true, optional = true }
handl-typegen-backend-json-schema = { workspace = true, optional = true }
handl-lib-utils = { workspace = true, optional = true }
handl-lib-datetime = { workspace = true, optional = true }
