  "crates/bench",
  "crates/cli",
  "crates/cli-plugin",
  "crates/experiment-host-sugar",
  "crates/meta",
  "crates/store",
  "crates/codebase",
  "crates/integration-tests",
  "crates/vm-type",
  "crates/vm-config",
  "crates/vm-server",
  "crates/lexer",
  "crates/lexer-canonical",
  "crates/lexer-common",
  "crates/parser",
  "crates/parser-canonical",
  "crates/parser-common",
  "crates/lib-websocket",
  "crates/lib-compress",
  "crates/lib-compress-gzip",
  "crates/lib-archive",
