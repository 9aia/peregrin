handl-lib-otlp = { path = "crates/lib-otlp" }
handl-lib-otlp-std = { path = "crates/lib-otlp-std" }
handl-lib-compress = { path = "crates/lib-compress" }
handl-lib-compress-gzip = { path = "crates/lib-compress-gzip" }
handl-lib-archive = { path = "crates/lib-archive" }
handl-lib-archive-tar = { path = "crates/lib-archive-tar" }
handl-vm = { path = "crates/vm" }
handl-vm-common = { path = "crates/vm-common" }
handl-vm-backend-rust-interpreter = { path = "crates/vm-backend-rust-interpreter" }
handl-frontend-json = { path = "crates/frontend-json" }
handl-frontend-yaml = { path = "crates/frontend-yaml" }
handl-frontend-toml = { path = "crates/frontend-toml" }
handl-source = { path = "crates/source" }
handl-fields = { path = "crates/fields" }
handl-cli = { path = "crates/cli" }
handl-cli-plugin = { path = "crates/cli-plugin" }
handl-frontend = { path = "crates/frontend" }
handl-vm-host-canonical = { path = "crates/vm-host-canonical" }
handl-compiler-common = { path = "crates/compiler-common" }
handl-compiler-canonical = { path = "crates/compiler-canonical" }
handl-compiler-backend-js = { path = "crates/compiler-backend-js" }
handl-compiler-pass-parse = { path = "crates/compiler-pass-parse" }
handl-compiler-pass-extract = { path = "crates/compiler-pass-extract" }
handl-compiler-pass-resolve = { path = "crates/compiler-pass-resolve" }
handl-compiler-pass-typecheck = { path = "crates/compiler-pass-typecheck" }
handl-compiler-pass-generate = { path = "crates/compiler-pass-generate" }
handl-compiler = { path = "crates/compiler" }
handl-compiler-tests = { path = "crates/compiler-tests" }
handl-typegen-core = { path = "crates/typegen-core" }
handl-typegen-key-set-special = { path = "crates/typegen-key-set-special" }
handl-module-resolver-core = { path = "crates/module-resolver-core" }
handl-module-resolver-memory = { path = "crates/module-resolver-memory" }
handl-module-resolver-noop = { path = "crates/module-resolver-noop" }
handl-module-resolver-file = { path = "crates/module-resolver-file" }
handl-module-resolver-virtual = { path = "crates/module-resolver-virtual" }
