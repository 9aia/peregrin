handl-lib-test = { workspace = true, optional = true }
handl-lib-kv = { workspace = true, optional = true }
handl-lib-kv-hashmap = { workspace = true, optional = true }
handl-lib-os = { workspace = true, optional = true }
handl-lib-os-std = { workspace = true, optional = true }
handl-lib-http-client = { workspace = true, optional = true }
handl-lib-http-client-std = { workspace = true, optional = true }
handl-lib-http-server = { workspace = true, optional = true }
handl-lib-http-server-std = { workspace = true, optional = true }
handl-lib-otlp = { workspace = true, optional = true }
handl-lib-otlp-std = { workspace = true, optional = true }
handl-lib-unicode = { workspace = true, optional = true }
handl-lib-ip = { workspace = true, optional = true }
handl-store = { workspace = true, optional = true }
handl-codebase = { workspace = true, optional = true }
handl-vm-config = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

