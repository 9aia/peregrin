[package]
name = "handl-bench"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
handl-compiler.workspace = true
handl-compiler-common.workspace = true
handl-dialect.workspace = true
handl-dialect-canonical.workspace = true
handl-lexer.workspace = true
handl-lexer-canonical.workspace = true
handl-parser-common.workspace = true
handl-parser-canonical.workspace = true
handl-ast-common.workspace = true
handl-frontend.workspace = true
handl-module-resolver-virtual.workspace = true
handl-typecheck-core.workspace = true
handl-typecheck-infer.workspace = true
handl-typecheck-keys.workspace = true
handl-typecheck-schema-json.workspace = true
handl-typegen-key-set-special.workspace = true
handl-typegen-import.workspace = true
handl-fields.workspace = true
handl-vm-values-json.workspace = true
handl-vm.workspace = true
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [
  "plotters",
  "cargo_bench_support",
] }

[lib]
bench = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "typecheck"
harness = false

[[bench]]
name = "infer"
harness = false

[[bench]]
name = "core"
harness = false

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "parser"
harness = false
