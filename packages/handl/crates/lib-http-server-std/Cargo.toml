[package]
name = "handl-lib-http-server-std"
version.workspace = true
edition.workspace = true

[dev-dependencies]
ureq = "2"

[dependencies]
handl-lib-http-server.workspace = true
handl-vm-backend-rust-interpreter.workspace = true
handl-vm-host-canonical.workspace = true
handl-vm-values-json.workspace = true
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
mime_guess = "2"
matchit = "0.8"
serde_json = "1"
