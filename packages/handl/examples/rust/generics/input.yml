$:
  identity:
    type: function
    typeParams: ["T"]
    params:
      - name: x
        schema: { type: var, name: T }
    return: { type: var, name: T }
  first:
    type: function
    typeParams: ["T"]
    params:
      - name: arr
        schema:
          type: array
          items: { type: var, name: T }
    return: { type: var, name: T }
  map:
    type: function
    typeParams: ["T", "U"]
    params:
      - name: arr
        schema:
          type: array
          items: { type: var, name: T }
      - name: fn
        schema:
          type: function
          params:
            - name: x
              schema: { type: var, name: T }
          return: { type: var, name: U }
    return:
      type: array
      items: { type: var, name: U }
  name:
    type: string
    expr: 'identity("handl")'
  first_tag:
    type: string
    expr: "first(tags)"

identity:
  params:
    x: { type: string }
  return: { type: string }
  body: "x"

first:
  params:
    arr: { type: array, items: { type: string } }
  return: { type: string }
  body: "arr"

map:
  params:
    arr: { type: array, items: { type: string } }
    fn:
      type: function
      params:
        x: { type: string }
      return: { type: string }
      body: "x"
  return: { type: array, items: { type: string } }
  body: "arr"

name: handl
version: 1
tags:
  - language
  - runtime
